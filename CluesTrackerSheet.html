        <p>It does not work out the answer for you. It records what happened. What you conclude is still yours.</p>
        <p>The sheet has three categories and 21 cards: Suspects, Weapons, and Rooms. It opens with the Clue Classic names.</p>

        <h3>Setting up a new game</h3>
        <p>There are no steps. Change what you need, in any order, then start the game. Once the game has started, those edits close. New Game is how you come back to them.</p>
        <ul>
            <li><strong>Cards.</strong> You can change any card's name. The category names stay as they are. Cards are not added or removed.</li>
            <li><strong>Players.</strong> Type each name in a column heading. You can drag a column by the palm on the left of the name, or by the heading. The order the named columns are in when you start the game is the turn order. In the parentheses, type how many cards that player was dealt. A player with a name and no count keeps the game closed. A column with no name stays on the page and is left out of the game.</li>
            <li><strong>Me.</strong> Right-click your own column heading and choose <strong>"🙋 I am [your name]"</strong>. That column turns green. Click the cells for the cards you hold. A ✓ appears, and the number of checks has to match your card count.</li>
            <li><strong>Start Game.</strong> You need at least two players, counting yourself. Three cards are in the envelope. The other 18 go to the players or the board. Start Game opens when the counts add up to 18, so nothing is on the board, or when every seated player has the same count and the cards left over are on the board. Next and Undo then run the game.</li>
        </ul>

        <h3>The sheet during play</h3>
        <p>Your column starts with a ✓ for each card you hold and a ✗ for each card you do not. Every other player is crossed off the cards you hold. The first player's column is highlighted.</p>
        <p>The line under the title shows the turn, and whose turn it is. The bar above the grid says what is happening now. A tap in the wrong place puts a hint on the turn line, and the hint stays until it clears.</p>
        <p>You can drag a column in Setup and during play, by the palm on the left of the name or by the heading. After the game has started, a drag only changes place. The turn order does not follow that drag. The card names, the ∑ column, and the 🏠 column stay where they are.</p>

        <h3>A turn</h3>
        <ul>
            <li><strong>Click the asked cards.</strong> Click one card from each category in the asking player's column. A ? appears. That is three cards. Click a chosen card again to take that choice back, until someone has shown.</li>
            <li><strong>Click the name of the player who showed.</strong> Anyone passed over on the way gets a ✗ on each asked card.</li>
            <li><strong>When someone shows you a card,</strong> a box asks which card you were shown. After you click it a ✓ is written in that player's column for that card.</li>
            <li><strong>When you show a card,</strong> a box asks which card you showed. After you select it, the word Me is written in the asking player's column for that card.</li>
            <li><strong>When one other player shows another,</strong> a ! is written on each asked card in the shower's column. It means they showed one of those cards. It does not name which one. The other players are crossed off the asked cards.</li>
            <li>To take back a show between two players before Next is pressed, click the showing player's name again, and then once more.</li>
            <li><strong>If nobody can show,</strong> press Next. The other players are crossed off the asked cards.</li>
            <li><strong>Next</strong> moves to the next player. The log on the right keeps the actions for each turn.</li>
            <li><strong>Undo</strong> takes the turn back. If the turn has already started, the marks entered on it leave, and you are back at the start of that same turn. At the start of a turn, Undo takes back the turn before it. The marks from that turn leave. A note of up to four characters, typed into a cell by right-clicking it, stays in that cell. The log does not record that note.</li>
        </ul>
        <p>If a player does not get to ask, a tap on Next records that they did not ask, and the turn moves on.</p>

        <h3>Reading the marks</h3>
        <ul>
            <li><strong>✓</strong> — this player has this card.</li>
            <li><strong>✗</strong> — this player does not have this card.</li>
            <li><strong>?</strong> — this player asked about this card.</li>
            <li><strong>!</strong> — this player showed a card on that turn. Which card stays private, unless they showed it to you.</li>
            <li><strong>Me</strong> — you showed this card to this player.</li>
        </ul>
        <p>Once a cell has a ✓ or a ✗, a ! in that cell is hidden. The ? stays, so you can still see that the card was asked about.</p>

        <h3>Cell Marks</h3>
        <p>A right-click on a player's cell during a game opens a box for up to four characters. They show in the corner. The sheet does not use them. An empty column does not open the box.</p>

        <h3>The Summary column</h3>
        <p>The narrow ∑ column is yours. It is what you believe about the ∑nvelope. A click moves the cell from nothing, to a red ✕, to a green ✓, and then back to nothing. A red ✕ means some player is known to hold that card. A green ✓ means you believe the envelope holds it. The sheet does not use these marks. The helpers can color a card, but they never mark this column for you.</p>

        <h3>The House column</h3>
        <p>The 🏠 column is for a card you have seen on the board. Click that card's house cell and a ✓ appears. Click again to clear it. When the pointer leaves the cell, the other players are crossed off that card, and the log records it. You see a board card on your own turn, in a room that has a card, after you have asked your three cards and nobody can show.</p>

        <h3>The ? button</h3>
        <p>The ? button opens seven helpers. They start off. A tick turns one on. They only color a name or a cell, or post a note. They never write a mark. During a game they read the marks, the house checks, how many cards the House holds, and the shows that have been written. A show you have undone is left out. You can ignore the color.</p>
        <ul>
            <li><strong>Must be part of the answer</strong> — green on a card name, when nobody can hold it and every House card has been checked.</li>
            <li><strong>Ruled out</strong> — red on a card name, when someone holds it, it is on the board, or it has to be an unseen House card.</li>
            <li><strong>Gave it away on a show</strong> — red on a card name, when a show leaves only one card that player can hold. A House card is one they do not hold.</li>
            <li><strong>Hand fully known</strong> — red down the rest of a column, once every card in that hand is found. A House card is not one of their cards.</li>
            <li><strong>Must hold</strong> — green on the cards a player is forced to hold. A House card is one they do not hold.</li>
            <li><strong>Last card standing</strong> — green on the last card left in a category. A checked House card is ruled out, and this can show before every House card is checked.</li>
            <li><strong>Fencing</strong> — works from the pattern of shows, tints the rest of a column red, and posts a note when it pins a hand down. A House card is one they do not hold.</li>
        </ul>
        <p>The fuller wording is at the end of this guide. You do not need it to play.</p>

        <h3>Game decks</h3>
        <p>A game deck is the set of card names. You can keep four. Save Current stores the names on the page. Import brings a deck in from a file. Right-click a saved deck to export it or delete it. During play that bar shows the moment you are in, and the saved decks are not on screen.</p>

        <h3>If you leave and come back</h3>
        <p>Refresh the page in the middle of a game and the game comes back: the marks, the log, the highlighted column, and Next and Undo. The summary marks stay. When no game is going, setup stays as you left it. New Game clears the saved game, so that game does not come back.</p>

        <h3>If something feels stuck</h3>
        <p>The turn line tells you what was wrong. The asked cards may not all be chosen yet. The asker cannot also be the one who shows. A player crossed off every asked card cannot show. A player who is known to hold one of them has to show before anyone later in the turn. If the page is blocking a turn you believe happened, Undo and enter it again.</p>
        <p>Have fun. The point is to play, and to let the page do the bookkeeping.</p>

        <h3>Appendix — what each helper means</h3>
        <p>You do not need this to play. The helpers live behind the ? button and stay off until you tick them. Their colors show during play. The panel opens on its own when you are in setup. Nothing here writes a mark. A real ✓ or ✗, and the highlight on the current player, paint over any hint.</p>
        <ul>
            <li><strong>Must be part of the answer (green).</strong> When every player is ruled out on a card, no one holds it. It is one of the secret cards only once every House card has been checked, and this card is not one of them. Until then it can still be an unseen House card. Its name turns green once the House is full.</li>
            <li><strong>Ruled out (red).</strong> A card someone holds, or a card checked in the 🏠 column, cannot be a secret card. A card nobody holds also cannot, when that category's answer is already known and the House still has unseen cards: it has to be one of those House cards. Its name turns red.</li>
            <li><strong>Gave it away on a show (red).</strong> When a player showed a card and already has a ✗ on every other card asked that turn, the card that is left is the one they hold. A House card counts as one they do not hold. Its name turns red. It watches shows between two other players. A ✗ you learn later counts. If the marks contradict the show, it colors nothing.</li>
            <li><strong>Hand fully known (red).</strong> When a player is marked as holding as many cards as they were dealt, every other cell in their column is tinted red. A House card is not one of their cards.</li>
            <li><strong>Must hold (green).</strong> When a column is crossed off everywhere except exactly as many cards as that player was dealt, those remaining cards are tinted green. A House card counts as one they do not hold.</li>
            <li><strong>Last card standing (green).</strong> When every card in a category but one is ruled out, that card's name turns green. A checked House card counts as ruled out. This can turn green before every House card has been checked, because the envelope still needs one card in that category.</li>
            <li><strong>Fencing (red).</strong> Every show between two other players proves the shower holds at least one of the cards asked. A House card counts as one they do not hold. Once enough of those proofs pin down a player's unseen cards, the rest of their column is tinted red.</li>
        </ul>
        <p><strong>A few shared rules.</strong> Hand fully known, Must hold, and Fencing need the card count. Without it they stay quiet for that player. Your own column is skipped. If the marks contradict a rule, it colors nothing.</p>
        <p><strong>Where the color lands.</strong> Some helpers tint a card's name — green when it belongs in the answer, red when it is ruled out. Others tint cells in one player's column — red for a card they cannot hold, green for one they must.</p>
        <p><strong>Asking why.</strong> Right-click a tinted card name during play and a short note says why it is colored. The note clears itself after a few seconds. A right-click on a player's cell does not open this note. It opens the box for up to four characters.</p>
        <p><strong>The fencing notes.</strong> While Fencing is on, a note under the checkboxes says what the grid does not. When a hand is pinned down it names the cards, for example "Eve holds: Plum, Rope and Hall (turns 1, 2 and 3)." If the marks cannot all be true, it says so. When there is nothing to report, it reads "Nothing definite yet."</p>
    `;
}
// M7: theme toggle. Dark is the default. Light is opt-in.
// The icon shown is what you'd click to switch — ☀ when dark, 🌙 when light.
const THEME_KEY = 'mtr_theme_v1';
function getCurrentTheme() {
    return document.documentElement.classList.contains('light') ? 'light' : 'dark';
}
function setTheme(theme) {
    if (theme === 'light') document.documentElement.classList.add('light');
    else document.documentElement.classList.remove('light');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    updateDarkModeButtonIcon();
}
function toggleDarkMode() {
    setTheme(getCurrentTheme() === 'dark' ? 'light' : 'dark');
}

function updateDarkModeButtonIcon() {
    const btn = document.getElementById('btnDarkMode');
    if (!btn) return;
    if (getCurrentTheme() === 'dark') {
        btn.textContent = '☀';
        btn.title = 'Switch to light mode';
        btn.classList.remove('moon');
    } else {
        btn.textContent = '☽';
        btn.title = 'Switch to dark mode';
        btn.classList.add('moon');
    }
}

// ═══════════════════════════════════════════════════════════════════
// M4: MODAL DIALOG SYSTEM (replaces native prompt/confirm)
// ═══════════════════════════════════════════════════════════════════
function showModal(opts) {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalTitle').textContent = opts.title || '';
    const bodyEl = document.getElementById('modalBody');
    bodyEl.innerHTML = '';
    if (opts.body)        bodyEl.appendChild(opts.body);
    else if (opts.bodyHTML) bodyEl.innerHTML = opts.bodyHTML;
    const actions = document.getElementById('modalActions');
    actions.innerHTML = '';
    (opts.buttons || []).forEach(b => {
        const btn = document.createElement('button');
        let cls = 'btn ';
        if (b.primary)      cls += 'btn-gold';
        else if (b.danger)  cls += 'btn-red';
        else                cls += 'btn-ghost';
        btn.className = cls;
        btn.textContent = b.label;
        if (b.confirmTwoTap) {
            let armed = false;
            let armTimeout = null;
            const originalLabel = btn.textContent;
            const originalClass = btn.className;
            btn.onclick = () => {
                if (armed) {
                    clearTimeout(armTimeout);
                    if (b.action) b.action();
                    else hideModal();
                    return;
                }
                armed = true;
                btn.textContent = b.confirmLabel || 'Sure ?';
                btn.className = originalClass + ' btn-confirm-armed';
                armTimeout = setTimeout(() => {
                    armed = false;
                    btn.textContent = originalLabel;
                    btn.className = originalClass;
                }, 4000);
            };
        } else {
            btn.onclick = () => {
                if (b.action) b.action();
                else hideModal();
            };
        }
        actions.appendChild(btn);
    });
    overlay.classList.add('open');
    // Default: focus the first input if any
    setTimeout(() => {
        const first = bodyEl.querySelector('input,textarea,select,button');
        if (first) { first.focus(); if (first.select) first.select(); }
    }, 50);
}

function hideModal() {
    document.getElementById('modalOverlay').classList.remove('open');
}

function onModalOverlayClick(e) {
    // Click on backdrop (not the inner window) closes the modal
    if (e.target.id === 'modalOverlay') hideModal();
}

document.addEventListener('keydown', e => {
    const overlay = document.getElementById('modalOverlay');
    if (overlay && overlay.classList.contains('open') && e.key === 'Escape') hideModal();
});

// Replacement for prompt() — onSubmit receives the entered string, or null on cancel.
// Optional opts.validate(value) returns an error string (modal stays open with inline
// message + input re-focused) or a falsy value (modal closes, onSubmit fires).
function modalPrompt(opts) {
    const wrapper = document.createElement('div');
    if (opts.message) {
        const p = document.createElement('div'); p.style.marginBottom = '10px'; p.textContent = opts.message;
        wrapper.appendChild(p);
    }
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'modal-input';
    input.value = opts.defaultValue || '';
    input.maxLength = opts.maxLength || 32;
    if (opts.placeholder) input.placeholder = opts.placeholder;
    wrapper.appendChild(input);
    const errorEl = document.createElement('div');
    errorEl.className = 'modal-error';
    errorEl.style.cssText = 'color:var(--red-lt); margin-top:8px; min-height:1.2em; font-size:0.9rem;';
    wrapper.appendChild(errorEl);
    const tryCommit = () => {
        const val = input.value.trim();
        if (opts.validate) {
            const err = opts.validate(val);
            if (err) {
                errorEl.textContent = err;
                input.focus(); input.select();
                return;
            }
        }
        errorEl.textContent = '';
        hideModal();
        opts.onSubmit && opts.onSubmit(val);
    };
    showModal({
        title: opts.title || 'Enter a value',
        body: wrapper,
        buttons: [
            { label: 'Cancel', action: () => { hideModal(); opts.onSubmit && opts.onSubmit(null); } },
            { label: opts.okLabel || 'Save', primary: true, confirmTwoTap: !!opts.confirmTwoTap, action: tryCommit }
        ]
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !opts.confirmTwoTap) tryCommit();
    });
    // Clear the inline error as soon as the user starts editing.
    input.addEventListener('input', () => { errorEl.textContent = ''; });
}

// Replacement for confirm() — onConfirm called on OK, onCancel optional
function modalConfirm(opts) {
    showModal({
        title: opts.title || 'Confirm',
        bodyHTML: opts.message || '',
        buttons: [
            { label: opts.cancelLabel || 'Cancel', action: () => { hideModal(); opts.onCancel && opts.onCancel(); } },
            { label: opts.okLabel || 'OK', primary: !opts.danger, danger: !!opts.danger, confirmTwoTap: !!opts.confirmTwoTap, action: () => {
                hideModal(); opts.onConfirm && opts.onConfirm();
            } }
        ]
    });
}

// ═══════════════════════════════════════════════════════════════════
// F4: PLAYER CARD COUNT (the original M4 design, restored; real data,
// per player). Stored as numbers — null = not entered (display shows
// '?'). Same on-screen layout "Pat (5)": name box = the person playing,
// parentheses = how many cards they were dealt. Carried in autosaves
// and decks. The count deduction rules read this array.
// ═══════════════════════════════════════════════════════════════════
let playerCardCounts = Array(MAX_PLAYERS).fill(null);
function onCardCountChange(col) {
    const inp = document.getElementById('p'+(col+1)+'c');
    if (!inp) return;
    // Digits only, 2-char hard cap; anything else is stripped as typed.
    let v = inp.value.replace(/\D/g, '').slice(0, 2);
    if (v !== inp.value) inp.value = v;
    playerCardCounts[col] = v === '' ? null : parseInt(v, 10);
    refreshCardCountDisplays();
    updatePhaseBarText();
    updateButtonStates();
    autoSave();
}
function refreshCardCountDisplays() {
    for (let col = 0; col < MAX_PLAYERS; col++) {
        const dEl = document.getElementById('p'+(col+1)+'cd');
        if (dEl) dEl.textContent = (playerCardCounts[col] === null) ? '?' : String(playerCardCounts[col]);
    }
}

// ═══════════════════════════════════════════════════════════════════
// M11/14 — PER-STEP SNAPSHOTS
//   Each setup step gets its own saved snapshot (categories, mutes,
//   player names + card counts, plus the typing-undo stack). The snapshot
//   for Step N is captured the moment the user leaves Step N — whether
//   forward via Next or backward via Undo. When they re-enter Step N,
//   the snapshot is restored, so each step looks exactly the way they
//   last left it. typingUndoStack rides inside each snapshot too, so
//   it accumulates with the step instead of being wiped at every transition.
// ═══════════════════════════════════════════════════════════════════
let stepSnapshots = {};   // M12/01: { [stepNum]: { categories, mutedCategoryIdxs,
                          //                          mutedCards, typingUndoStack } }
                          //   Names + card counts are NOT snapshotted; the DOM input
                          //   boxes own those (Step 4 is the only step that edits them).

// M12/01: per-step snapshots no longer carry headerNames / playerCardCounts.
//   Player names and card counts are only editable in Step 4, so the DOM input
//   boxes are the single source of truth. Snapshotting them per step caused
//   a stale Step-5 snapshot to clobber later edits made back in Step 4.
function captureStepSnapshot() {
    return {
        categories:        CATEGORIES.map(c => ({ name: c.name, cards: [...c.cards] })),
        mutedCategoryIdxs: [...mutedCategoryIdxs],
        mutedCards:        [...mutedCards],
        typingUndoStack:   typingUndoStack.map(e => ({ ...e })),
    };
}

function restoreStepSnapshot(snap) {
    if (!snap) return;
    CATEGORIES = snap.categories.map(c => ({ name: c.name, cards: [...c.cards] }));
    normalizeCategoryShape();
    mutedCategoryIdxs = new Set(snap.mutedCategoryIdxs || []);
    mutedCards        = new Set(snap.mutedCards || []);
    // M12/01: headerNames + playerCardCounts intentionally NOT restored — see capture.
    typingUndoStack = (snap.typingUndoStack || []).map(e => ({ ...e }));
    rebuildAllCards();
    buildTable();
    renderAllCells();
    renderInfoBar();
}

// ═══════════════════════════════════════════════════════════════════
// TYPING UNDO — step-scoped via the M11/14 snapshot mechanism above.
// Each step carries its own typing history; Undo Typing pops the last
// edit made in the current step. The stack is saved/restored with the
// step snapshot when Undo / Next move between steps.
// ═══════════════════════════════════════════════════════════════════
function pushTypingUndo(entry) {
    typingUndoStack.push(entry);
    updateButtonStates();
}
function clearTypingUndo() {
    typingUndoStack = [];
    updateButtonStates();
}
function undoTyping() {
    if (gamePhase !== 'setup' || typingUndoStack.length === 0) return;
    const entry = typingUndoStack.pop();
    applyTypingUndo(entry);
    updateButtonStates();
    autoSave();
}
function applyTypingUndo(entry) {
    switch (entry.type) {
        case 'player-name': {
            const inp = document.getElementById('p' + (entry.col + 1) + 'h');
            if (inp) {
                inp.value = entry.oldValue;
                inp._oldTypingValue = undefined;
                onNameChange();
            }
            break;
        }
        case 'card-count':
        case 'nickname': /* legacy alias from the nickname era */ {
            const inp = document.getElementById('p' + (entry.col + 1) + 'c');
            if (inp) {
                inp.value = entry.oldValue;
                inp._oldTypingValue = undefined;
                onCardCountChange(entry.col);
            }
            break;
        }
        case 'cat-name': {
            if (CATEGORIES[entry.catIdx]) {
                CATEGORIES[entry.catIdx].name = entry.oldValue;
                buildTable();
                renderAllCells();
                renderInfoBar();
            }
            break;
        }
        case 'card-name': {
            const cat = CATEGORIES[entry.catIdx];
            if (cat && cat.cards[entry.cardIdx] !== undefined) {
                const currentName = cat.cards[entry.cardIdx];
                const targetName  = entry.oldValue;
                if (currentName === targetName) break;
                cat.cards[entry.cardIdx] = targetName;
                rebuildAllCards();
                if (cellState[currentName]) {
                    cellState[targetName] = cellState[currentName];
                    delete cellState[currentName];
                }
                if (mutedCards.has(currentName)) {
                    mutedCards.delete(currentName);
                    mutedCards.add(targetName);
                }
                solutionCards.delete(currentName);
                buildTable();
                renderAllCells();
                renderInfoBar();
            }
            break;
        }
    }
}
// Wires focus/blur on a typing input. On focus we capture the prior value;
// on blur, if it changed, we push a typing-undo entry built from the prior value.
function wireTypingInput(input, entryBuilder) {
    if (!input || input._typingWired) return;
    input._typingWired = true;
    input.addEventListener('focus', () => {
        if (gamePhase !== 'setup') return;
        input._oldTypingValue = input.value;
    });
    input.addEventListener('blur', () => {
        if (gamePhase !== 'setup') return;
        if (input._oldTypingValue === undefined) return;
        if (input._oldTypingValue !== input.value) {
            pushTypingUndo(entryBuilder(input._oldTypingValue));
        }
        input._oldTypingValue = undefined;
    });
}

// M4: Summary column manual marks, keyed by card name. Value: '' | 'x' | 'check'
let summaryMarks = {};
function getSummaryMark(card) { return summaryMarks[card] || ''; }
function cycleSummaryMark(card) {
    const cur = summaryMarks[card] || '';
    summaryMarks[card] = (cur === '' ? 'x' : (cur === 'x' ? 'check' : ''));
    if (!summaryMarks[card]) delete summaryMarks[card];
}

// ═══════════════════════════════════════════════════════════════════
// M11/03: ROOM COLUMN — 2-player variant face-down-card tracker.
//   Stores the set of card names whose Room cell is checked. When a card
//   is room-checked: ✗ propagates across every active player column (no
//   one holds it), and the card is excluded from being a solution candidate
//   (you've seen it on the board, it can't be the secret).
// ═══════════════════════════════════════════════════════════════════
let roomChecked = new Set();
// M11/04: per-card cycle state for Room cells. roomCycleSnapshot[card] is
// the room-checked state at the start of the current click cycle (the
// engine baseline). roomUndoLists[card] is the row-of-✗s we propagated on
// the most recent committed ✓, so a later cycle can roll it back precisely.
let roomCycleSnapshot = {};
let roomUndoLists     = {};

// Click handler — display-only. No row propagation, no log entry; the
// commit on mouseleave handles both.
function toggleRoomDisplay(card) {
    if (!(card in roomCycleSnapshot)) {
        if (roomUndoLists[card] && roomUndoLists[card].length) {
            roomUndoLists[card].forEach(undoEntry);
            delete roomUndoLists[card];
        }
        roomCycleSnapshot[card] = roomChecked.has(card);
    }
    if (roomChecked.has(card)) roomChecked.delete(card);
    else                       roomChecked.add(card);
    renderRoomCell(card);
    autoSave();
}

function commitRoomCycle(card) {
    if (!(card in roomCycleSnapshot)) return;
    delete roomCycleSnapshot[card];
    const cur = roomChecked.has(card);

    if (cur) {
        if (!roomUndoLists[card]) {
            roomUndoLists[card] = propagateRowCross(card, -1);
        }
        logRoomMark(card, 'check');
    } else {
        if (roomUndoLists[card]) {
            roomUndoLists[card].forEach(undoEntry);
            delete roomUndoLists[card];
        }
        logRoomMark(card, 'blank');
    }
    if (enginePlaying()) {
        const engineHas = Engine.inspect().houseChecked[card] !== undefined;
        if (engineHas !== cur) Engine.houseTap(card);
        renderAllCells();
    }
    renderFullLog();
    autoSave();
}

function renderRoomCell(card) {
    const td = document.querySelector(`td.room-col[data-card="${CSS.escape(card)}"]`);
    if (!td) return;
    const inner = td.querySelector('.cell-inner');
    if (!inner) return;
    inner.innerHTML = '';
    if (roomChecked.has(card)) {
        const sp = document.createElement('span');
        sp.className = 'room-check'; sp.textContent = '✓';
        sp.title = 'Seen face-down in a room (board card)';
        inner.appendChild(sp);
    }
}

function logRoomMark(card, action) {
    gameLog = gameLog.filter(e => !(e.room && e.roomCard === card && e.turn === turnCount));
    if (action === 'blank') return;
    gameLog.push({
        turn: turnCount,
        playerIdx: -1, player: 'Board', isMe: false,
        room: true, roomAction: action, roomCard: card,
    });
}

// M5+: Popup for Me-as-asker — pick which of the 3 asked cards the shower showed me.
function openMeAskerPicker(showerCol, askedCards) {
    const showerName = getColName(showerCol);
    const wrapper = document.createElement('div');
    const intro = document.createElement('div');
    intro.style.marginBottom = '12px';
    intro.innerHTML = `Which card did <strong>${showerName}</strong> show you?`;
    wrapper.appendChild(intro);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; justify-content:center;';
    const cardsForPicker = askedCards.filter(card => {
        const cs = cellState[card];
        return !(cs && cs[showerCol] && cs[showerCol].cross);
    });
    cardsForPicker.forEach(card => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-gold';
        btn.style.cssText = 'font-size:1rem; padding:8px 16px;';
        btn.textContent = card;
        btn.onclick = () => {
            hideModal();
            markCell(card, showerCol, 'check');
            markCell(card, showerCol, 'shownToMe');
            applyAutoXOnCheck(card, showerCol);
            const n        = turnOrder.length;
            const askerIdx = turnOrder.indexOf(meCol);
            const allAsked = askedCards;
            let i = (askerIdx + 1) % n;
            let steps = 0;
            while (turnOrder[i] !== showerCol && steps < n) {
                allAsked.forEach(ac => applyAutoX(ac, turnOrder[i], []));
                i = (i + 1) % n;
                steps++;
            }
            pendingShownMe.push({ card, col:showerCol, player:showerName, committed:true, autoXDone:true });
            if (liveLogEntry) liveLogEntry.shownMe.push({ card, player: showerName });
            renderAllCells(); renderFullLog();
            updateModeBar(); updateStage(); updateUndoButton(); renderInfoBar();
            autoSave();
        };
        row.appendChild(btn);
    });
    wrapper.appendChild(row);
    showModal({ title:'Shown to Me', body:wrapper, buttons:[{ label:'Cancel', action:hideModal }] });
}

// M5+: Popup for Me-as-shower — pick which of the asker's 3 cards I showed.

    const wrapper = document.createElement('div');

        const hasIt = cellState[card] && cellState[card][meCol] && cellState[card][meCol].check;

            }
            const n        = turnOrder.length;
            const askerIdx = turnOrder.indexOf(askerCol);
            const allAsked = askedCards;
            let i = (askerIdx + 1) % n;
            let steps = 0;
            while (turnOrder[i] !== meCol && steps < n) {
                allAsked.forEach(ac => applyAutoX(ac, turnOrder[i], []));
                i = (i + 1) % n;
                steps++;
            }
            pendingIShowed.push({ card, col: askerCol, toPlayer: askerName, committed: true });
            if (liveLogEntry) liveLogEntry.iShowed.push({ card, toPlayer: askerName });

        row.appendChild(btn);

    showModal({ title:'You Showed', body:wrapper, buttons:[{ label:'Cancel', action:hideModal }] });
}

// ═══════════════════════════════════════════════════════════════════
// M3: GAME DECK SAVE / LOAD
// Stores the structural config (categories, names, counts, card names).
// Up to 6 saved decks; last-used deck remembered between sessions.
// ═══════════════════════════════════════════════════════════════════
const DECK_KEY      = 'mtr_game_decks_v1';
const LAST_DECK_KEY = 'mtr_last_deck_v1';
const MAX_DECKS     = 4; // M10/02: reduced from 6 — Patrick's smaller laptops show only 4 slots cleanly.
let lastUsedDeckIdx = -1;

function getSavedDecks() {
    try { return JSON.parse(localStorage.getItem(DECK_KEY)) || []; }
    catch { return []; }
}
function setSavedDecks(decks) { localStorage.setItem(DECK_KEY, JSON.stringify(decks)); }
function saveLastUsedDeck()   { localStorage.setItem(LAST_DECK_KEY, String(lastUsedDeckIdx)); }
function loadLastUsedDeck() {
    const v = parseInt(localStorage.getItem(LAST_DECK_KEY));
    lastUsedDeckIdx = isNaN(v) ? -1 : v;
}

function snapshotCurrentDeck(name) {
    // A Game Deck stores the Card-column data (category names, card names, divider positions)
    // PLUS the player column-header names AND the muted layout (which categories/cards are
    // switched off). The player names ride along so loading a deck on another laptop (via
    // export/import, OneDrive sync, etc.) brings back the same suspect line-up; the muted
    // layout rides along so the deck loads with exactly the cards/categories it was saved with.
    // Marks, notes, gameLog, turnCount, etc. are NOT in the deck (a deck load wipes the grid).
    // M11/28 (#15): mutedCategoryIdxs + mutedCards now saved. mutedCards is stored by NAME,
    //   which is safe because those names ARE this deck's own card names — they match on load.
    // M10/01: `players` field added (Item #3 pull-forward — save with deck).
    // M10/Me: the deck never carries the "Me" header label or meCol. If a Me column is
    //   currently picked, write the original suspect name back into that slot so the deck
    //   file always reads clean suspect names. Each laptop picks its own Me after loading.
    const players = getPlayerNames();
    if (meCol >= 0 && meCol < players.length && meOriginalName) {
        players[meCol] = meOriginalName;
    }
    return {
        name: (name || 'Deck').trim().slice(0, 6) || 'Deck',
        categories: CATEGORIES.map(c => ({ name:c.name, cards:[...c.cards] })),
        players: players,
        // F4: card counts ride with the players so the same header layout
        //   ("Pat (5)") comes back on every laptop after a deck load.
        cardCounts: [...playerCardCounts],
        // M11/28 (#15): muted layout saved with the deck so a load restores exactly the
        //   cards/categories that were switched off when it was saved.
        mutedCategoryIdxs: [...mutedCategoryIdxs],
        mutedCards:        [...mutedCards]
    };
}

function saveGameDeck() {
    // M11/26: pre-check slot capacity. If all MAX_DECKS slots are full, surface
    //   the warning immediately on the Save Current tap (instead of waiting for
    //   the user to type a name and then rejecting it in validate).
    //   M11/27: also flash a 3-second popup with the same message.
    if (getSavedDecks().length >= MAX_DECKS) {
        showDeckStatus('No open slots', 'var(--red-lt)');
        showModal({ title: 'No open slots', bodyHTML: '', buttons: [] });
        setTimeout(hideModal, 3000);
        return;
    }
    modalPrompt({
        title: 'Save Slot',
        message: 'Name this slot (6 chars max).',
        placeholder: 'Slot name',
        maxLength: 6,
        okLabel: 'Save',
        validate: (name) => {
            const trimmed = name.trim();
            if (!trimmed) return 'Slot name cannot be empty.';
            const decks = getSavedDecks();
            if (decks.some(d => d && d.name === trimmed)) return `Slot name "${trimmed}" already used.`;
            if (decks.length >= MAX_DECKS)                 return 'No open slots';
            return null;
        },
        onSubmit: (name) => {
            if (name === null) return;
            const trimmed = name.trim();
            const decks = getSavedDecks();
            decks.push(snapshotCurrentDeck(trimmed));
            _commitDeckSave(decks, decks.length - 1, trimmed);
        }
    });
}
function _commitDeckSave(decks, idx, name) {
    setSavedDecks(decks);
    lastUsedDeckIdx = idx;
    saveLastUsedDeck();
    renderDeckSlots();
    showDeckStatus(`Deck "${name}" saved (slot ${idx + 1}).`, 'var(--red-lt)');
}

function loadGameDeck(idx) {
    const decks = getSavedDecks();
    const deck = decks[idx];
    if (!deck) return;
    // M10/03: Offer "Load saved names?" if this deck was saved with player names.
    const hasPlayers = Array.isArray(deck.players) && deck.players.some(n => n && n.trim());
    let bodyHTML = `Load Game Deck "<strong>${deck.name}</strong>"? Category and card names will change, and <strong>all marks on the board will be cleared</strong>.`;
    if (hasPlayers) {
        bodyHTML += ` <br><br><label style="display:flex;align-items:center;gap:6px;cursor:pointer;">`
                  + `<input type="checkbox" id="loadDeckPlayersChk" checked> `
                  + `<span>Also load the saved player names</span></label>`;
    }
    showModal({
        title: 'Load Game Deck',
        bodyHTML,
        buttons: [
            { label: 'Cancel', action: () => hideModal() },
            { label: 'Load', primary: true, confirmTwoTap: true, action: () => {
                const chk = document.getElementById('loadDeckPlayersChk');
                const loadPlayers = chk ? chk.checked : false;
                hideModal();
                _doLoadGameDeck(idx, deck, { loadPlayers });
            } }
        ]
    });
}
function _doLoadGameDeck(idx, deck, opts) {
    opts = opts || {};
    // ─────────────────────────────────────────────────────────────────────
    // M11/28 (#15): Deck load WIPES the grid, then sets the new deck's labels
    // and muted layout.
    //   • cellState marks (including Me's ✓), summaryMarks (∑), roomChecked — ALL WIPED
    //   • mutedCategoryIdxs / mutedCards — set FROM THE DECK (old decks with no
    //     stored layout fall back to the built-in default: Cat 4 + last 3 cards)
    //   • playerNames, playerCardCounts, gameLog, turnCount, gamePhase — UNTOUCHED
    // Rationale: a preserved ✓ could silently re-point to a different card after the
    // labels change, so we clear the board rather than carry marks across decks.
    // The startup auto-restore (~3690) only loads a deck when no game is in progress,
    // so wiping there is harmless and correctly applies the deck's saved mutes.
    // M11/01: cellNotes capture removed (mini-notes feature retired).
    // ─────────────────────────────────────────────────────────────────────

    // 1) Apply the new deck's names + divider positions.
    //    Tolerantly read old fat-format decks: only `categories[].name` and `categories[].cards`
    //    are consulted; any other field on the deck is ignored.
    const safeCats = Array.isArray(deck.categories) ? deck.categories : [];
    CATEGORIES = safeCats.map(c => ({
        name: (c && typeof c.name === 'string') ? c.name : 'Category',
        cards: Array.isArray(c && c.cards) ? [...c.cards] : []
    }));
    normalizeCategoryShape();
    rebuildAllCards();

    // 2) WIPE the grid — build a fresh blank cellState for the new cards, and clear
    //    summaryMarks + roomChecked. No marks carry across a deck load.
    // M11/01: cellNotes rebuild removed (mini-notes feature retired).
    const newCellState = {};
    ALL_CARDS.forEach(card => {
        newCellState[card] = {};
        for (let c = 0; c < MAX_PLAYERS; c++) {
            newCellState[card][c] = { check:false, cross:false, asked:false, showed:false, shownToMe:false, iShowedMe:false, marks:[] };
        }
    });
    cellState    = newCellState;
    summaryMarks = {};
    roomChecked  = new Set();

    // 3) Nothing is muted in this version.
    mutedCategoryIdxs = new Set();
    mutedCards        = new Set();

    // 4) M10/03: Restore player names ONLY when caller asks for it.
    //    loadGameDeck() shows a "Load saved names?" checkbox in the popup and passes
    //    the result via opts.loadPlayers. The window-load auto-restore path passes true
    //    so previously saved players come back when reopening the app.
    if (opts.loadPlayers && Array.isArray(deck.players)) {
        for (let i = 0; i < MAX_PLAYERS; i++) {
            const ph = document.getElementById('p' + (i + 1) + 'h');
            if (ph && typeof deck.players[i] === 'string') {
                ph.value = deck.players[i];
            }
        }
        // F4: Card counts ride with the players. If the deck has them, restore;
        //   otherwise clear so we don't inherit counts from whatever was on
        //   screen. (Decks from the nickname era carried `nicknames` — text;
        //   those are discarded and the counts show '?' until typed.)
        if (Array.isArray(deck.cardCounts) && deck.cardCounts.length === MAX_PLAYERS) {
            playerCardCounts = deck.cardCounts.map(v =>
                (typeof v === 'number' && Number.isInteger(v) && v >= 0 && v <= 99) ? v : null);
        } else {
            playerCardCounts = Array(MAX_PLAYERS).fill(null);
        }
        for (let i = 0; i < MAX_PLAYERS; i++) {
            const cc = document.getElementById('p' + (i + 1) + 'c');
            if (cc) cc.value = (playerCardCounts[i] === null) ? '' : String(playerCardCounts[i]);
        }
        refreshCardCountDisplays();
    }

    // 5) Player names/card counts, gameLog, turn counters, gamePhase, undo stacks —
    //    preserved. (Muted state is set from the deck in step 3; marks are wiped in step 2.)
    //
    // M10/Me: Me is session state, NOT deck data. Always clear it on deck load so each
    //   laptop picks its own Me via Step 5 (right-click suspect column). This also
    //   makes OneDrive-synced decks behave correctly across family laptops.
    meCol = -1;
    meOriginalName = '';
    applyMeColStyling();

    lastUsedDeckIdx = idx;
    saveLastUsedDeck();
    buildTable();
    applyInactiveColStyling();
    renderAllCells(); renderFullLog(); renderInfoBar(); updateUndoButton();
    renderDeckSlots();
    autoSave();
    showDeckStatus(`Deck "${deck.name}" loaded — board cleared, ready to play.`, 'var(--red-lt)');
}

function deleteGameDeck(idx) {
    const decks = getSavedDecks();
    const deck = decks[idx];
    if (!deck) return;
    modalConfirm({
        title: 'Delete Game Deck',
        message: `Delete saved Game Deck "<strong>${deck.name}</strong>"? This cannot be undone.`,
        okLabel: 'Delete', danger: true, confirmTwoTap: true,
        onConfirm: () => {
            decks.splice(idx, 1);
            setSavedDecks(decks);
            if (lastUsedDeckIdx === idx)        lastUsedDeckIdx = -1;
            else if (lastUsedDeckIdx > idx)     lastUsedDeckIdx--;
            saveLastUsedDeck();
            renderDeckSlots();
            showDeckStatus(`Deck "${deck.name}" deleted.`, 'var(--gold-dk)');
        }
    });
}

// ═══════════════════════════════════════════════════════════════════
// M10/10: Deck Export / Import (OneDrive sync between laptops)
// ───────────────────────────────────────────────────────────────────
// Export writes ONE .json file containing the saved deck slot's
// categories + cards, the player names, the per-slot Rules text, and
// the slot name. Import opens a file picker, validates the .json,
// then asks which slot to drop into (overwrite warning if occupied).
// File shape is versioned so future loaders can read older exports.
// ═══════════════════════════════════════════════════════════════════
const DECK_FILE_FORMAT  = 'mystery-tracker-deck';
const DECK_FILE_VERSION = 3;   // v2 added the muted layout; v3 carries card
                               // counts (numbers) where v2 carried nicknames

function openDeckSlotMenu(idx, x, y) {
    _ctxTarget = { kind:'deck-slot', idx }; _ctxX = x; _ctxY = y;
    const menu = document.getElementById('ctxMenu');
    if (!menu) return;
    menu.innerHTML = '';
    const decks = getSavedDecks();
    const deck = decks[idx];
    if (!deck) { hideCtxMenu(); return; }

    const itemExport = document.createElement('div');
    itemExport.className = 'ctx-item';
    itemExport.textContent = '📤 Export to file…';
    itemExport.onclick = () => { hideCtxMenu(); exportDeckSlot(idx); };
    menu.appendChild(itemExport);

    const div = document.createElement('div'); div.className = 'ctx-divider';
    menu.appendChild(div);

    const itemDelete = document.createElement('div');
    itemDelete.className = 'ctx-item danger';
    itemDelete.textContent = '🗑 Delete this deck';
    itemDelete.onclick = () => { hideCtxMenu(); deleteGameDeck(idx); };
    menu.appendChild(itemDelete);

    menu.classList.add('open');
    positionPopupAtCursor(menu, x, y, 4);
}

// Sanitize a deck name into a safe filename fragment.
function _safeFileName(s) {
    return String(s || 'Deck').replace(/[^A-Za-z0-9._-]+/g, '_').slice(0, 40) || 'Deck';
}
// "YYYY-MM-DD" in local time so the file is dated when you exported, not UTC.
function _todayStamp() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${d.getFullYear()}-${m}-${dd}`;
}

function exportDeckSlot(idx) {
    const decks = getSavedDecks();
    const deck = decks[idx];
    if (!deck) return;

    const payload = {
        format:    DECK_FILE_FORMAT,
        version:   DECK_FILE_VERSION,
        exportedAt: new Date().toISOString(),
        name:      deck.name || 'Deck',
        categories: (deck.categories || []).map(c => ({
            name:  (c && typeof c.name === 'string') ? c.name : 'Category',
            cards: Array.isArray(c && c.cards) ? [...c.cards] : []
        })),
        players:    Array.isArray(deck.players)    ? [...deck.players]    : [],
        cardCounts: Array.isArray(deck.cardCounts) ? [...deck.cardCounts] : [],
        mutedCategoryIdxs: [...(deck.mutedCategoryIdxs || [])],
        mutedCards:        [...(deck.mutedCards || [])]
    };

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${_safeFileName(deck.name)}-${_todayStamp()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    showDeckStatus(`Deck "${deck.name}" exported as ${a.download}.`, 'var(--red-lt)');
}

function importDeckFromFile() {
    // Hidden <input type=file> — created fresh each time so re-picking the same
    // file fires the 'change' event again.
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.onchange = () => {
        const file = input.files && input.files[0];
        document.body.removeChild(input);
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            let data;
            try { data = JSON.parse(reader.result); }
            catch (e) { showDeckStatus('Could not read that file — not valid JSON.', 'var(--red-lt)'); return; }
            // Validate shape. Tolerate missing optional fields but require categories.
            if (!data || data.format !== DECK_FILE_FORMAT) {
                showDeckStatus('That .json is not a Clues Tracker Sheet deck export.', 'var(--red-lt)');
                return;
            }
            if (!Array.isArray(data.categories) || data.categories.length === 0) {
                showDeckStatus('That deck file has no categories — nothing to import.', 'var(--red-lt)');
                return;
            }
            pickSlotForImport(data);
        };
        reader.onerror = () => showDeckStatus('Could not read that file.', 'var(--red-lt)');
        reader.readAsText(file);
    };
    input.click();
}

function pickSlotForImport(data) {
    const decks = getSavedDecks();
    const labels = [];
    for (let i = 0; i < MAX_DECKS; i++) {
        const d = decks[i];
        labels.push(d ? `Slot ${i+1}: ${d.name}` : `Slot ${i+1}: (empty)`);
    }
    const importName = (data.name || 'Deck').toString().slice(0, 6);
    let bodyHTML = `Import deck "<strong>${importName}</strong>" into which slot?<br><br>`
                 + `<div style="display:flex;flex-direction:column;gap:6px;">`
                 + labels.map((l, i) => {
                       const occupied = !!decks[i];
                       const cls = occupied ? 'btn-red' : 'btn-gold';
                       return `<button class="btn ${cls}" onclick="commitImport(${i})" style="text-align:left;">${l}${occupied ? ' ⚠' : ''}</button>`;
                   }).join('')
                 + `</div>`
                 + `<div style="margin-top:8px;font-size:0.85rem;color:var(--text-muted);">Slots marked ⚠ already contain a deck — picking one will overwrite it (you'll be asked again to confirm).</div>`
                 + `<div id="importPickerError" style="margin-top:10px;font-size:0.95rem;color:var(--red-lt);font-style:italic;min-height:1.2em;"></div>`;
    _pendingImport = data;
    showModal({
        title: 'Import Game Deck',
        bodyHTML,
        buttons: [
            { label: 'Cancel', action: () => { _pendingImport = null; hideModal(); } }
        ]
    });
}

let _pendingImport = null;

function commitImport(slotIdx) {
    const data = _pendingImport;
    if (!data) { hideModal(); return; }
    const decks = getSavedDecks();
    const occupied = !!decks[slotIdx];
    const importName = (data.name || 'Deck').toString().slice(0, 6);
    // M10/Polish: refuse to create a second slot with the same name. The modal STAYS
    //   open — we show the message inline so the user can pick a different slot
    //   without losing the option list.
    const dupIdx = decks.findIndex((d, i) => i !== slotIdx && d && d.name === importName);
    if (dupIdx >= 0) {
        const errEl = document.getElementById('importPickerError');
        if (errEl) {
            errEl.textContent = `⚠ Slot ${dupIdx + 1} already has a deck named "${importName}". Pick slot ${dupIdx + 1} to overwrite it, or Cancel and delete it first.`;
        }
        return;
    }
    // Clear any prior duplicate-name error before proceeding.
    const errEl = document.getElementById('importPickerError');
    if (errEl) errEl.textContent = '';

    const doWrite = () => {
        const newDeck = {
            name: importName,
            categories: data.categories.map(c => ({
                name:  (c && typeof c.name === 'string') ? c.name : 'Category',
                cards: Array.isArray(c && c.cards) ? [...c.cards] : []
            })),
            players:    Array.isArray(data.players)    ? [...data.players]    : [],
            // F4: v3 files carry cardCounts. Older v2 files carried text
            // nicknames — discarded; the slot reads '?' until counts are typed.
            cardCounts: Array.isArray(data.cardCounts) ? [...data.cardCounts] : [],
            mutedCategoryIdxs: [...(data.mutedCategoryIdxs || [])],
            mutedCards:        [...(data.mutedCards || [])]
        };
        decks[slotIdx] = newDeck;
        setSavedDecks(decks);
        _pendingImport = null;
        renderDeckSlots();
        showDeckStatus(`Imported "${newDeck.name}" into slot ${slotIdx + 1}. Click the slot to load it.`, 'var(--red-lt)');
    };

    if (occupied) {
        modalConfirm({
            title: 'Overwrite slot?',
            message: `Slot ${slotIdx + 1} already holds "<strong>${decks[slotIdx].name}</strong>". Replace it with the imported deck "<strong>${importName}</strong>"?`,
            okLabel: 'Overwrite', danger: true, confirmTwoTap: true,
            onConfirm: () => { hideModal(); doWrite(); }
        });
    } else {
        hideModal();
        doWrite();
    }
}

function renderDeckSlots() {
    const container = document.getElementById('deckSlots');
    if (!container) return;
    container.innerHTML = '';
    const decks = getSavedDecks();
    for (let i = 0; i < MAX_DECKS; i++) {
        const deck = decks[i];
        const btn = document.createElement('button');
        if (deck) {
            btn.className = 'deck-slot' + (i === lastUsedDeckIdx ? ' active' : '');
            btn.textContent = deck.name;
            btn.title = `Load "${deck.name}". Right-click for Export / Delete.`;
            btn.onclick = () => loadGameDeck(i);
            // M10/10: right-click now opens a small menu (Export to file… / Delete).
            //   Export downloads a .json containing the deck + players + Rules text + slot name.
            //   Delete keeps the prior two-tap confirm behavior.
            btn.oncontextmenu = (e) => { e.preventDefault(); openDeckSlotMenu(i, e.clientX, e.clientY); };
        } else {
            btn.className = 'deck-slot empty';
            btn.textContent = (i+1) + '. Empty';
            btn.title = 'Click "Save Current" to fill an empty slot.';
            // M10/10: still trap right-click so the browser context menu doesn't pop up.
            btn.oncontextmenu = (e) => {
                e.preventDefault();

let _ctxTarget = null, _ctxX = 0, _ctxY = 0;

function renderCtxMenu() {
    const menu = document.getElementById('ctxMenu');
    if (!menu || !_ctxTarget) return;
    menu.innerHTML = '';
    const items = buildCtxItems(_ctxTarget);
    items.forEach(it => {
        if (it.divider) { const d = document.createElement('div'); d.className = 'ctx-divider'; menu.appendChild(d); return; }
        const div = document.createElement('div');
        div.className = 'ctx-item' + (it.danger ? ' danger' : '') + (it.disabled ? ' ctx-disabled' : '');
        div.textContent = it.label;
        if (!it.disabled && it.action) {
            div.onclick = () => {
                it.action();
                if (it.stayOpen) renderCtxMenu();  // refresh in place for repeat actions
                else hideCtxMenu();
            };
        }
        menu.appendChild(div);
    });
    menu.classList.add('open');
    // Position under the cursor (zoom-corrected), kept on-screen.

function hideCtxMenu() {

// Item 19: position a fixed popup so its top-left lands under the cursor.
// The page is drawn at --ui-zoom (0.9), but a mouse event's clientX/Y are the
// cursor's true on-screen spot, while a fixed element's left/top render inside
// that zoomed space — so the raw number lands ~10% short, the gap growing
// toward the bottom-right. Dividing by --ui-zoom cancels it. After placing,
// nudge back on-screen if the popup would overflow (pad = edge gap in px).
// Used by every cursor-placed popup; zoom = 1 makes it a no-op.
function positionPopupAtCursor(el, x, y, pad) {
    // Item 19 — place a fixed popup so the cursor lands just inside its top-left
    // (over the first item). x,y are the cursor's on-screen spot (clientX/Y); a
    // fixed element's left/top render inside the page's CSS zoom (--ui-zoom), so
    // divide by z — confirmed live in Firefox. zoom = 1 makes it a no-op.
    const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ui-zoom')) || 1;
    el.style.left = Math.max(0, (x - 12) / z) + 'px';
    el.style.top  = Math.max(0, (y - 10) / z) + 'px';
}

// ── Saved choices — ride the game snapshot (schemaVersion 8; see the
//    getSnapshot/applySnapshot wraps below). ALL rules start OFF.
//    A snapshot restore brings them back mid-game; New Game and older
//    saves (schema ≤ 7, no optRules field) start all-off. Decks never
//    carry them.
let optRules = { yesTint: false, noTint: false, showElim: false, handKnown: false, mustHold: false, lastCard: false, fencing: false };
try { localStorage.removeItem('mtr_optrules_v1'); } catch (e) {}   // retired standalone key

// During a game the helpers read the engine's marks, house checks, and
// show log. They still only color. One read is shared for a whole
// repaint, then dropped, so a later tick does not reuse a stale copy.
let engineReadOn = false;
let engineRead = null;

function beginEngineRead() {
    engineReadOn = true;
    engineRead = (typeof Engine !== 'undefined' && enginePlaying()) ? Engine.inspect() : null;
}
function endEngineRead() {
    engineReadOn = false;
    engineRead = null;
}
function engineSheet() {
    if (engineReadOn) return engineRead;
    if (typeof Engine === 'undefined' || !enginePlaying()) return null;
    return Engine.inspect();
}

function cardOnBoard(card) {
    if (roomChecked.has(card)) return true;
    const sheet = engineSheet();
    return !!(sheet && sheet.houseChecked[card] !== undefined);
}

// The House holds what is left of the 18 dealt cards after the
// players' counts. Null when those counts are not there to read.
function houseSize() {
    const names = getHeaderNames();
    let sum = 0;
    let seated = 0;
    for (let i = 0; i < MAX_PLAYERS; i++) {
        if (!(names[i] || '').trim()) continue;
        const n = playerCardCounts[i];
        if (typeof n !== 'number') return null;
        sum += n;
        seated++;
    }
    if (seated < 2) return null;
    const left = 18 - sum;
    if (left < 0) return null;
    return left;
}

function seenHouseCount() {
    let n = 0;
    for (const card of ALL_CARDS) {
        if (!isRowActive(card)) continue;
        if (cardOnBoard(card)) n++;
    }
    return n;
}

function houseFull() {
    const h = houseSize();
    if (h === null) return false;
    return seenHouseCount() >= h;
}

// Held by a player, or already checked in the House column.
function directlyRuledOut(card) {
    if (cardOnBoard(card)) return true;
    for (let c = 0; c < MAX_PLAYERS; c++) {
        if (playerHasCheck(card, c)) return true;
    }
    return false;
}

// Every player has ✗, and the card is not already located.
function nobodyHolds(card) {
    if (!isRowActive(card) || directlyRuledOut(card)) return false;
    if (turnOrder.length === 0) return false;
    for (let i = 0; i < turnOrder.length; i++) {
        const c = turnOrder[i];
        if (playerHasCheck(card, c)) return false;
        if (!playerHasCross(card, c)) return false;
    }
    return true;
}

// This category already has its answer: the last card left there,
// or a card nobody holds once every House card has been checked.
function categoryAnswerKnown(card) {
    const ci = getCatIdxOf(card);
    if (ci < 0 || !isCategoryActive(ci)) return false;
    for (const other of CATEGORIES[ci].cards) {
        if (other === card || !isCardActive(other)) continue;
        if (isLastCardStanding(other)) return true;
        if (nobodyHolds(other) && houseFull()) return true;
    }
    return false;
}

// Nobody holds it, the House still has unseen cards, and this
// category's answer is a different card, so this one is in the House.
function mustBeUnseenHouse(card) {
    if (houseFull() || !nobodyHolds(card)) return false;
    return categoryAnswerKnown(card);
}

function playerDoesNotHold(card, col) {
    if (playerHasCross(card, col)) return true;
    if (cardOnBoard(card)) return true;
    if (mustBeUnseenHouse(card)) return true;
    return false;
}

function playerHolds(card, col) {
    if (cardOnBoard(card) || mustBeUnseenHouse(card)) return false;
    return playerHasCheck(card, col);
}

function playerHasCheck(card, col) {
    const sheet = engineSheet();
    if (sheet) {
        const cell = (sheet.cellState[card] && sheet.cellState[card][col]) || [];
        return cell.some(m => m.type === 'check');
    }
    const s = cellState[card] && cellState[card][col];
    return !!(s && (s.check || s.shownToMe));
}

function playerHasCross(card, col) {
    const sheet = engineSheet();
    if (sheet) {
        const cell = (sheet.cellState[card] && sheet.cellState[card][col]) || [];
        return cell.some(m => m.type === 'cross');
    }
    const s = cellState[card] && cellState[card][col];
    return !!(s && s.cross);
}

// Shows between two other players that are still part of the game.
// An undone turn drops out. A show involving Me is already exact, so
// it is left out, the same way the old log scan left those out.
function thirdPartyShows() {
    const sheet = engineSheet();
    if (sheet) {
        const live = [];
        for (const e of sheet.turnLog) {
            if (e.type === 'undo') {
                for (let i = live.length - 1; i >= 0; i--) {
                    if (live[i].turn === e.turn) live.splice(i, 1);
                }
                continue;
            }
            if (e.type !== 'turn' || e.result !== 'showed') continue;
            if (!e.shower || e.shower === 'Me' || e.asker === 'Me') continue;
            if (!Array.isArray(e.cards) || e.cards.length === 0) continue;
            const col = sheet.players.indexOf(e.shower);
            if (col < 0) continue;
            live.push({ name: e.shower, turn: e.turn, asked: e.cards, col });
        }
        return live;
    }
    const entries = liveLogEntry ? [...gameLog, liveLogEntry] : gameLog;
    const out = [];
    for (const e of entries) {
        if (!e.showerName || !Array.isArray(e.asked) || e.asked.length === 0) continue;
        if ((e.shownMe && e.shownMe.length) || (e.iShowed && e.iShowed.length)) continue;
        const col = turnOrder.find(c => getColName(c) === e.showerName) ?? -1;
        if (col < 0) continue;
        out.push({ name: e.showerName, turn: e.turn, asked: e.asked, col });
    }
    return out;
}
