// ── Tint rendering — decoration only. Paints the card-name cell's
//    background; never touches marks or game data. Play phase only.
//    Green asks the engine's isSolutionCandidate() live at paint time
//    (not the stored set), so it can never show a stale answer.
function optRuleTintFor(card) {
    if (gamePhase !== 'play' || turnOrder.length === 0) return '';
    if (!isRowActive(card)) return '';   // muted rows stay plain
    if (optRules.yesTint && isSolutionCandidate(card))
        return 'color-mix(in srgb, var(--mark-check-fg) 25%, var(--row-th-bg))';
    if (optRules.lastCard && isLastCardStanding(card))
        return 'color-mix(in srgb, var(--mark-check-fg) 25%, var(--row-th-bg))';
    if (optRules.noTint && isCardRuledOut(card))
        return 'color-mix(in srgb, var(--mark-cross-fg) 25%, var(--row-th-bg))';
    if (optRules.showElim && showElimHolderFor(card))
        return 'color-mix(in srgb, var(--mark-cross-fg) 25%, var(--row-th-bg))';
    return '';
}

// ── F3 · N-1 elimination on the show — goes through each logged turn
//    where one OTHER player showed another a card (shows involving Me
//    are already exact: ✓* lands, or Me did the showing). If the shower
//    has ✗ on all that turn's asked cards but one, the show gave that
//    last card away — the shower holds it, so it's out of the answer.
//    ✗s learned later count: cards never move, so a ✗ learned on turn
//    12 was just as true on turn 5. Recomputed live over the whole log
//    at paint time. If the marks contradict a show (✗ on every asked
//    card), the rule draws nothing. Returns { name, turn } of the
//    earliest give-away show, or null.
function showElimHolderFor(card) {
    for (const e of thirdPartyShows()) {
        if (!Array.isArray(e.asked) || e.asked.length < 2) continue;
        const survivors = e.asked.filter(a => !playerDoesNotHold(a, e.col));
        if (survivors.length === 1 && survivors[0] === card)
            return { name: e.name, turn: e.turn };
    }
    return null;
}

// ── F3 · Last-card-standing — a category's only surviving card must
//    be the answer, even before its own row fills with ✗s. Recomputed
//    live (never the stored solutionCards set). Muted cards don't
//    count as survivors and don't need to be ruled out.
function isLastCardStanding(card) {
    if (directlyRuledOut(card)) return false;     // can't be the survivor
    const ci = getCatIdxOf(card);
    if (ci < 0 || !isCategoryActive(ci)) return false;
    for (const other of CATEGORIES[ci].cards) {
        if (other === card) continue;
        if (!isCardActive(other)) continue;       // muted card — ignore
        if (!directlyRuledOut(other)) return false; // another survivor
    }
    return true;
}

// Red's test: someone holds it, it is checked in the House, or it
// has to be an unseen House card because that category's answer
// is already known.
function isCardRuledOut(card) {
    if (directlyRuledOut(card)) return true;
    if (mustBeUnseenHouse(card)) return true;
    return false;
}

function applyOptRuleTint(card) {
    const th = document.querySelector(`tbody tr th[data-card="${CSS.escape(card)}"]`);
    if (th) th.style.background = optRuleTintFor(card);
}

// ── F4 · Hand fully known — when a player's card count is N and their
//    column holds N "they have it" marks (✓ / ✓*), their whole hand is
//    accounted for: every other card in that column is a silent ✗.
//    Me's column is skipped (your own hand is fully ✓'d at Start Game —
//    tinting it would be noise). More ✓s than the count is a
//    contradiction — the rule draws nothing. Recomputed live from the
//    marks + playerCardCounts at paint time; counts only marks on
//    active rows.
function handFullyKnown(col) {
    if (col === meCol) return false;
    const n = playerCardCounts[col];
    if (typeof n !== 'number') return false;     // no count typed → rule can't run
    let held = 0;
    for (const card of ALL_CARDS) {
        if (!isRowActive(card)) continue;
        if (playerHolds(card, col)) held++;
    }
    return held === n;
}

// ── F4 · Must hold — the reverse: when a player's column is ✗'d on
//    every active card except exactly N survivors (N = their card
//    count), those survivors must be their whole hand. Same guards:
//    Me skipped, no count = silent, muted rows aren't survivors, and
//    fewer survivors than the count is a contradiction — draws
//    nothing. (More survivors than the count is just normal mid-game.)
function mustHoldSurvivors(col) {
    if (col === meCol) return false;
    const n = playerCardCounts[col];
    if (typeof n !== 'number') return false;
    let survivors = 0;
    for (const card of ALL_CARDS) {
        if (!isRowActive(card)) continue;
        if (!playerDoesNotHold(card, col)) survivors++;
    }
    return survivors === n;
}

// ── F5 · Fencing — every show between two OTHER players proves the
//    shower holds at least one of that turn's asked cards: a fence.
//    Goes through the committed log plus the turn in progress (same
//    scan as the N-1 rule). A fence's survivors are that turn's asked
//    cards minus muted rows and minus cards with a real ✗ in the
//    shower's column. A ✓/✓* on any asked card explains the show —
//    the fence dissolves. No survivors at all is a contradiction —
//    the fence draws nothing, but it is reported (F5.1): the show
//    really happened, so one of the marks behind it must be wrong.
//    Recomputed live at paint time. Me is never fenced (shows
//    involving Me are exact; those entries are filtered out the
//    same way the N-1 rule does it).
//    Returns { fences, contradictions } — contradictions are the
//    zero-survivor shows: { col, name, turn }.
function computeFences() {
    if (gamePhase !== 'play' || turnOrder.length === 0) return { fences: [], contradictions: [] };
    const fences = [];
    const contradictions = [];
    for (const e of thirdPartyShows()) {
        const col = e.col;
        if (col < 0 || col === meCol) continue;
        let explained = false;
        const survivors = [];
        for (const card of e.asked) {
            if (!isRowActive(card)) continue;        // muted card — not in the game
            if (playerHolds(card, col)) { explained = true; break; }
            if (!playerDoesNotHold(card, col)) survivors.push(card);
        }
        if (explained) continue;                     // a known ✓ satisfies the show
        if (survivors.length === 0) {                // contradiction — draw nothing, report it
            contradictions.push({ col, name: e.name, turn: e.turn });
            continue;
        }
        fences.push({ col, name: e.name, turn: e.turn, survivors });
    }
    return { fences, contradictions };
}

// ── F5 · Closing a column with fences. Needs the player's card count:
//    unseen = count − their known ✓/✓*s (active rows only). When a set
//    of that player's fences, none sharing a card, matches the unseen
//    number exactly, each fence pins one unseen card — every unmarked
//    card OUTSIDE those fences is a silent ✗. The search is exhaustive
//    (fence counts are small). If several different fence sets close
//    the column, only cards inside ALL of them escape the tint — each
//    set justifies its own exclusion. Guards: Me skipped; no count =
//    silent. A contradiction — unexplained fences left when the whole
//    hand is already found, or more non-overlapping fences than unseen
//    cards — draws nothing but is reported (F5.1): the shows can't fit
//    the hand, so a mark or the card count must be wrong.
//    Returns null (nothing to say), or:
//      { contradiction: true } — the shows don't fit the hand; or
//      { closed: true,  escape, turns, unseen } — the column is closed:
//        the cards that escape the tint, the turns that did it; or
//      { closed: false, unseen, disjoint } — progress: how many fences
//        that don't overlap, vs the unseen count.
function fenceStatusFor(col, colFences) {
    if (col === meCol || colFences.length === 0) return null;
    const n = playerCardCounts[col];
    if (typeof n !== 'number') return null;       // no count — the rule can't close
    let held = 0;
    for (const card of ALL_CARDS) {
        if (!isRowActive(card)) continue;
        if (playerHolds(card, col)) held++;
    }
    const unseen = n - held;
    if (unseen < 1) return { contradiction: true }; // fences exist but the hand is full
    const sets = colFences.map(f => f.survivors);
    let maxSize = 0;
    const unions = [];
    const turns = new Set();
    const used = new Set();
    const chosen = [];
    (function rec(start, count) {
        if (count > maxSize) maxSize = count;
        if (count === unseen) {
            unions.push(new Set(used));
            chosen.forEach(j => turns.add(colFences[j].turn));
        }
        for (let j = start; j < sets.length; j++) {
            if (sets[j].some(c => used.has(c))) continue;   // overlap — skip
            sets[j].forEach(c => used.add(c));
            chosen.push(j);
            rec(j + 1, count + 1);
            chosen.pop();
            sets[j].forEach(c => used.delete(c));
        }
    })(0, 0);
    if (maxSize > unseen) return { contradiction: true }; // draw nothing, report it
    if (maxSize === unseen && unions.length > 0) {
        let escape = unions[0];
        for (let i = 1; i < unions.length; i++)
            escape = new Set([...escape].filter(c => unions[i].has(c)));
        return { closed: true, escape, turns, unseen };
    }
    return { closed: false, unseen, disjoint: maxSize };
}

// The column-cell tints for the count rules and fence closes. Red: a
// fully-known hand's leftover cells — or a fence-closed column's cells
// outside the fences — are silent ✗s. Green: a column cut down to
// exactly its count's worth of survivors — the unmarked survivors are
// silent ✓s. The classes' CSS deliberately has no !important, so the
// grid's own ✓/✗ colors, the current-turn column highlight, and
// muted-row grey all win over them.
function refreshCountRuleCellTints() {
    const inPlay = (gamePhase === 'play' && turnOrder.length > 0);
    const fences = (inPlay && optRules.fencing) ? computeFences().fences : [];
    for (let col = 0; col < MAX_PLAYERS; col++) {
        const fireRed   = inPlay && optRules.handKnown && handFullyKnown(col);
        const fireGreen = inPlay && optRules.mustHold  && mustHoldSurvivors(col);
        const st        = optRules.fencing
            ? fenceStatusFor(col, fences.filter(f => f.col === col)) : null;
        const closed    = (st && st.closed) ? st : null;
        document.querySelectorAll(`td[data-col="${col}"]`).forEach(td => {
            const card = td.dataset.card;
            const unmarked = !!(card && isRowActive(card) && !playerHasCheck(card, col) && !playerHasCross(card, col));
            const isHouse = !!(card && (cardOnBoard(card) || mustBeUnseenHouse(card)));
            const plain = unmarked && !isHouse;
            const houseBlank = unmarked && isHouse;
            const fenceRed = !!(closed && (plain || houseBlank) && !closed.escape.has(card));
            td.classList.toggle('optrule-silent-x',     (fireRed && (plain || houseBlank)) || fenceRed);
            td.classList.toggle('optrule-silent-check', fireGreen && plain);
        });
    }
}

// ── F5 · Fence notes — the panel posts only what is definite AND
//    cannot be shown any other way (Patrick, 2026-06-12, F5.1).
//    One line per player, and only once their column has closed.
//    Every close posts a line — the tint can't explain itself
//    (right-click on a tinted cell is the mark cycle, not a Why).
//    Plain shapes, no fence talk (Patrick): all unseen cards
//    named (with turns); or "holds X and Y — 1 unknown card";
//    or just the unknown count. No progress lines. Only
//    players with a card count typed can close (without one the
//    rule can't close, so there's nothing to report). Recomputed
//    live; newest activity first (matches the Log). Individual
//    fences are NOT listed — the ! marks and the Log already show
//    them (Patrick, 2026-06-12). Contradictions and fully-found
//    hands stay silent.
function fmtTurnList(turnSet) {
    const t = [...turnSet].sort((a, b) => a - b);
    if (t.length === 1) return 'turn ' + t[0];
    return 'turns ' + t.slice(0, -1).join(', ') + ' and ' + t[t.length - 1];
}

function addFenceNote(box, text, conflict) {
    const div = document.createElement('div');
    div.style.cssText = 'margin:0 0 8px;' + (conflict ? 'color:var(--red);' : '');
    div.textContent = text;
    box.appendChild(div);
}

// F5.1: each conflict is announced ONCE with the engine's brief status
// message the moment it first appears (the panel may be closed). Fixed
// conflicts drop out of this memory, so a recurrence announces again.
// Cleared when the rule is off, so re-enabling re-announces live ones.
let announcedConflicts = new Set();

function renderFenceNotes() {
    const box = document.getElementById('fenceNotes');
    if (!box) return;
    box.style.display = optRules.fencing ? '' : 'none';
    if (!optRules.fencing) { box.innerHTML = ''; announcedConflicts = new Set(); return; }
    box.innerHTML = '';
    const { fences, contradictions } = computeFences();
    // Conflicts first — they outrank results. Newest first, like the Log.
    const conflicts = [...contradictions]
        .sort((a, b) => b.turn - a.turn)
        .map(c => ({
            key:    `show:${c.col}:${c.turn}`,
            line:   `${c.name}'s show on turn ${c.turn} conflicts with the ✗s in their column — one of those marks is wrong.`,
            status: `${c.name}'s show on turn ${c.turn} conflicts with the ✗s in their column — check the ? panel.`
        }));
    // One line per player; order by newest fence, like the Log.
    const cols = [...new Set(fences.map(f => f.col))]
        .sort((a, b) => Math.max(...fences.filter(f => f.col === b).map(f => f.turn))
                      - Math.max(...fences.filter(f => f.col === a).map(f => f.turn)));
    const closedLines = [];
    for (const col of cols) {
        const colFences = fences.filter(f => f.col === col);
        const st = fenceStatusFor(col, colFences);
        if (!st) continue;
        const name = colFences[0].name;
        if (st.contradiction) {
            conflicts.push({
                key:    `count:${col}`,
                line:   `${name}'s shows don't fit their hand — a mark or their card count is wrong.`,
                status: `${name}'s shows don't fit their hand — check the ? panel.`
            });
            continue;
        }
        if (!st.closed) continue;
        // Every close posts one plain line (F5.1, Patrick's wording).
        // "Holds" = cards from fences narrowed to a single survivor —
        // those are definitely in the hand.
        const pinned = ALL_CARDS.filter(c =>
            colFences.some(f => f.survivors.length === 1 && f.survivors[0] === c));
        const unknown = st.unseen - pinned.length;
        const fmtCards = a => a.length === 1 ? a[0]
            : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
        if (st.escape.size === st.unseen) {
            const cards = ALL_CARDS.filter(c => st.escape.has(c));
            closedLines.push(`${name} holds: ${fmtCards(cards)} (${fmtTurnList(st.turns)}).`);
        } else if (unknown < 1) {
            closedLines.push(`${name} holds: ${fmtCards(pinned)} (${fmtTurnList(st.turns)}).`);
        } else {
            const tail = unknown === 1
                ? '1 unknown card, not one of the tinted.'
                : `${unknown} unknown cards, none of the tinted.`;
            closedLines.push(pinned.length
                ? `${name} holds ${fmtCards(pinned)} — ${tail}`
                : `${name}: ${tail}`);
        }
    }
    conflicts.forEach(c => addFenceNote(box, c.line, true));
    closedLines.forEach(t => addFenceNote(box, t));
    if (conflicts.length + closedLines.length === 0) {
        const p = document.createElement('div');
        p.style.cssText = 'color:var(--text-muted);font-style:italic;';
        p.textContent = 'Nothing definite yet.';
        box.appendChild(p);
    }
    // Announce any conflict not seen before; forget the ones now fixed.
    const fresh = conflicts.find(c => !announcedConflicts.has(c.key));
    if (fresh) showStatus(fresh.status, 'var(--red-lt)');
    announcedConflicts = new Set(conflicts.map(c => c.key));
}

function refreshOptRuleTints() {
    beginEngineRead();
    try {
        ALL_CARDS.forEach(applyOptRuleTint);
        refreshCountRuleCellTints();
        renderFenceNotes();
    } finally {
        endEngineRead();
    }
}

// ── Hooks — wrapped from inside the module so engine code is never
//    edited. Every repaint of a cell or Room cell (marks, undo, loads,
//    Start Game, full redraws) refreshes ALL tints — since F3, a mark
//    on one card can change another card's tint (last-card-standing),
//    so one card's repaint is no longer enough. Still cheap: 30 rows.
const _f1_renderCell = renderCell;
renderCell = function(card, col) {
    _f1_renderCell(card, col);
    refreshOptRuleTints();
};
const _f1_renderRoomCell = renderRoomCell;
renderRoomCell = function(card) {
    _f1_renderRoomCell(card);
    refreshOptRuleTints();
};
// F5: the Log renderer runs right after the shower's name lands in the
// live entry (the cell repaints fire just BEFORE that, too early), so
// this wrap is what puts fences, notes and closes at the shower tap.
const _f5_renderFullLog = renderFullLog;
renderFullLog = function() {
    _f5_renderFullLog();
    refreshOptRuleTints();
};

// ── F5 · Save/load wraps — checkbox states ride the game snapshot.
//    Wrapped from inside the module like the repaint hooks above, so
//    the engine's save/load code is never edited. Save: add the rule
//    states and stamp schemaVersion 8. Load: read them back before the
//    engine repaints (so the restored board lands with the right tints),
//    defaulting all-off when the field is absent (older saves), then
//    redraw the checkboxes to match. New Game resets every rule to off.
const _f5_getSnapshot = getSnapshot;
getSnapshot = function() {
    const snap = _f5_getSnapshot();
    snap.optRules = { ...optRules };
    snap.schemaVersion = 8;
    return snap;
};

const _f5_applySnapshot = applySnapshot;
applySnapshot = function(d) {
    const o = (d && d.optRules && typeof d.optRules === 'object') ? d.optRules : null;
    for (const k of Object.keys(optRules)) optRules[k] = o ? !!o[k] : false;
    _f5_applySnapshot(d);
    buildOptRulesChecklist();
    refreshOptRuleTints();
};

const _f5_doNewGame = _doNewGame;
_doNewGame = function(opts) {
    for (const k of Object.keys(optRules)) optRules[k] = false;
    buildOptRulesChecklist();
    _f5_doNewGame(opts);
    openHelpersPanel();          // New Game lands in Setup
};

// Return to Setup also opens the panel.
const _f5_doEditSetup = _doEditSetup;
_doEditSetup = function() {
    _f5_doEditSetup();
    openHelpersPanel();
};

// Page load that lands in Setup opens the panel. This listener is
// registered after the engine's, so the phase (restored save, deck,
// or fresh board) is settled by the time it runs.
window.addEventListener('load', () => {
    if (gamePhase === 'setup') openHelpersPanel();
});

// The module's own stylesheet — one rule, injected from here so the
// feature stays self-contained (deleting the module removes it too).
(function () {
    if (!document.head) return;   // test sandbox has no <head>; browser always does
    const st = document.createElement('style');
    st.textContent =
        'td.optrule-silent-x { background-color: color-mix(in srgb, var(--mark-cross-fg) 25%, transparent); }\n' +
        'td.optrule-silent-check { background-color: color-mix(in srgb, var(--mark-check-fg) 25%, transparent); }';
    document.head.appendChild(st);
})();

// Draw the checklist once at load (script runs after the panel exists).
buildOptRulesChecklist();

// ── F2 · "Why?" tooltip — right-click a card NAME in Play to see
//    why it's tinted. Pure message: it dismisses itself after 5
//    seconds; any click clears it early. Read-only — the answer is
//    recomputed live at click time, never read from the stored
//    solutionCards set (that set can go stale after an Undo).
let _whyTipEl = null, _whyTipTimer = null;

function hideWhyTip() {
    if (_whyTipTimer) { clearTimeout(_whyTipTimer); _whyTipTimer = null; }
    if (_whyTipEl) { _whyTipEl.remove(); _whyTipEl = null; }
}

// The explanation, recomputed fresh. Empty string = no tip
// (card untinted, or that tint's checkbox is off).
function whyTextFor(card) {
    beginEngineRead();
    try {
        if (optRules.yesTint && isSolutionCandidate(card))
            return 'Must be part of the answer — every player has ✗, and every House card has been checked.';
        if (optRules.lastCard && isLastCardStanding(card))
            return 'Must be part of the answer — every other card in this category is ruled out.';
        if (optRules.noTint && isCardRuledOut(card)) {
            if (cardOnBoard(card)) return 'Ruled out — it’s on the board.';
            for (let c = 0; c < MAX_PLAYERS; c++) {
                if (playerHasCheck(card, c)) {
                    const name = getPlayerNames()[c] || ('Player ' + (c + 1));
                    return 'Ruled out — ' + name + ' holds this card.';
                }
            }
            if (mustBeUnseenHouse(card)) return 'Ruled out — it has to be a House card.';
        }
        if (optRules.showElim) {
            const hit = showElimHolderFor(card);
            if (hit) return 'Ruled out — ' + hit.name + ' must hold this card: they showed it on turn '
                          + hit.turn + ' and have ✗ on the other asked cards.';
        }
        return '';
    } finally {
        endEngineRead();
    }
}

function showWhyTip(x, y, text) {
    hideWhyTip();
    const el = document.createElement('div');
    el.className = 'ctx-menu open';          // same dark box as the menus
    el.style.cssText = 'padding:6px 12px; max-width:260px; min-width:0;';
    el.textContent = text;
    document.body.appendChild(el);
    // Place near the cursor (zoom-corrected), kept on-screen.
    positionPopupAtCursor(el, x + 10, y + 10, 8);
    _whyTipEl = el;
    _whyTipTimer = setTimeout(hideWhyTip, 5000);
}

// Hook — document-level, so no engine code is edited. The card-name
// right-click is free in Play (the Setup menu handler exits early),
// and the app-wide handler already suppresses the browser menu.
document.addEventListener('contextmenu', e => {
    hideWhyTip();                            // a new right-click clears an old tip
    if (gamePhase !== 'play' || turnOrder.length === 0) return;
    const th = e.target.closest('tbody tr[data-card] > th[data-card]');
    if (!th) return;
    const card = th.dataset.card;
    if (!isRowActive(card)) return;          // muted rows stay silent
    const text = whyTextFor(card);
    if (text) showWhyTip(e.clientX, e.clientY, text);
});
document.addEventListener('click', hideWhyTip);
</script>
</body>
