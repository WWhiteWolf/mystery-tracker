<script src="clues-tracker-engine.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// 🕯 CLUE TRACKER — Ver. 3.1
// ═══════════════════════════════════════════════════════════════════
//
// TABLE OF CONTENTS
// ─────────────────────────────────────────────────────────────────
//  LINE  SECTION
// ─────────────────────────────────────────────────────────────────
//   ~346  CONSTANTS        — Card arrays (SUSPECTS, WEAPONS, ROOMS)
//   ~374  STATE            — All game state variables
//   ~377  initState()      — Reset cell state for all cards/columns
//
//   ~388  BUILD TABLE      — buildTable(), buildSection()
//   ~419  renderCardLabel()— Setup: editable input / play: plain text
//   ~444  renameCard()     — Rename a card in setup phase
//   ~475  updateCardLabels()— Lock/unlock card name inputs
//
//   ~484  RENDER CELL      — renderCell(card, col) — draws symbols in cell
//   ~528  renderAllCells() — Re-renders every cell + locks
//   ~535  applyAutoXOnCheck() — Auto-✗ rest of row when ✓ placed
//
//   ~551  COLUMN STYLING   — applyMeColStyling(), applyPlayLocks()
//   ~566  applyPlayLocks() — Master locking function (all stages/turns)
//   ~672  applyBlankColLock()— Lock/mute inactive (not in turnOrder) cols
//   ~687  applyActiveTurnStyling()— Highlight current player column
//   ~694  applyColLock()   — Lock cols during asking (shift mode)
//
//   ~712  PLAYER HELPERS   — getPlayerNames(), findMeCol(),
//                            buildTurnOrder(), getCurrentCol(),
//                            getCurrentPlayerName(), getColName()
//
//   ~762  SETUP PHASE      — applyInactiveColStyling(), onNameChange()
//   ~784  startGame()      — Validate & start game, auto-✗ Me's non-cards
//   ~824  editSetup()      — Return to setup, clear game data
//
//   ~859  CELL CLICK       — onCellClick(e) — main click handler
//                            Thinking stage: mark Asked (1-3 cards)
//                            Waiting stage:  mark Shown/I-Showed
//
//  ~1002  HEADER CLICK     — headerRow click → mark Showed (S)
//                            Commits S marks + auto-✗ passing players
//
//  ~1094  TURN STAGE       — updateStage() — updates Info Bar stage text
//  ~1127  updateModeBar()  — Updates mode text in phase banner
//
//  ~1156  CLEAR PENDING    — clearPending() — resets all pending state
//
//  ~1174  AUTO-✗ HELPERS  — canAutoX(), applyAutoX()
//
//  ~1195  SOLUTION FLAGS   — isSolutionCandidate(), updateSolutionFlags()
//                            renderSolutionFlags() — 🔍 + flash green/red
//
//  ~1248  UNDO SYSTEM      — pushUndo(), updateUndoButton(), undoStage()
//                            Granular: Undo Shower → Undo Asked → Undo Turn
//
//  ~1438  NEXT PLAYER      — nextPlayer() — finalizes turn, applies auto-✗,
//                            builds log entry, advances turnStep
//
//  ~1554  INFO BAR         — renderInfoBar() — Was Shown / I Showed sections
//  ~1660  addLabel/addEmpty— Info bar helpers
//
//  ~1676  GAME LOG         — renderFullLog() — compact color-coded log
//
//  ~1753  SAVE / LOAD      — getSnapshot(), applySnapshot()
//                            saveGame(), loadGame(), autoSave(), newGame()
//
//  ~1838  START            — Page init, auto-restore saved game
// ─────────────────────────────────────────────────────────────────
//
// KEY STATE VARIABLES (see ~374 for full list):
//   cellState[card][col]  — {check, cross, asked, showed, shownToMe, iShowedMe}
//   turnOrder[]           — Active column indices in play order
//   turnStep              — Index into turnOrder (current player)
//   meCol                 — Column index of "Me" player
//   gamePhase             — 'setup' | 'play'
//   committedAsked[]      — Cards asked this turn (after 3rd click)
//   pendingShowed[]       — Showed marks pending (header click)
//   undoStack[]           — Full turn snapshots for Undo Last Turn
//   typingUndoStack[]     — In-step typing edits for Undo Typing (setup steps 2-4)
//
// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════════
// Three categories, 21 cards. Nothing is muted, and rows do not move.
const MAX_CATEGORIES   = 3;
const TOTAL_CARDS      = 21;
// M10/09 — Player count is a single config knob. All player loops, init arrays,
//   and snapshot length checks read from MAX_PLAYERS, so expanding to Master
//   Detective's 10 players (Item #7) only requires changing this number
//   (plus building the extra column <th>s dynamically). No deduction logic
//   depends on the value being 6 specifically.
const MAX_PLAYERS      = 6;
const CAT_CSS_CLASSES  = ['cat-1','cat-2','cat-3','cat-4'];
function defaultCategories() {
    return [
        { name:'Suspects', cards:['Mr. Green','Col. Mustard','Dr. Orchid','Mrs. Peacock','Prof. Plum','Miss Scarlett'] },
        { name:'Weapons', cards:['Candlestick','Dagger','Lead Pipe','Revolver','Rope','Wrench'] },
        { name:'Rooms', cards:['Ballroom','Billiard Room','Conservatory','Dining Room','Hall','Kitchen','Library','Lounge','Study'] }
    ];
}
let CATEGORIES = defaultCategories();
let mutedCategoryIdxs = new Set();
let mutedCards        = new Set();
let ALL_CARDS = [];
function rebuildAllCards() { ALL_CARDS = CATEGORIES.flatMap(c => c.cards); }
// M11/18: which category does this card belong to? Returns -1 if not found.
function getCatIdxOf(cardName) {
    for (let i = 0; i < CATEGORIES.length; i++) {
        if (CATEGORIES[i].cards.includes(cardName)) return i;
    }
    return -1;
}
function totalCardCount()  { return CATEGORIES.reduce((s,c) => s + c.cards.length, 0); }
function isCategoryActive(idx) { return !mutedCategoryIdxs.has(idx); }
function isCardActive(name)    { return !mutedCards.has(name); }
// A card's row is live only if neither the card nor its category is muted.
function isRowActive(card) {
    const ci = CATEGORIES.findIndex(cat => cat.cards.includes(card));
    return (ci < 0 || isCategoryActive(ci)) && isCardActive(card);
}
function activeCategoryCount() { return CATEGORIES.filter((_,i) => isCategoryActive(i)).length; }

// Force CATEGORIES into the fixed shape: exactly 3 categories, exactly 21 cards total.
// Pads with generic Card N names if short; trims tails if long. Empty categories get 1 card minimum.
function normalizeCategoryShape() {
    while (CATEGORIES.length < MAX_CATEGORIES) CATEGORIES.push({ name:'Category ' + (CATEGORIES.length + 1), cards:[] });
    if (CATEGORIES.length > MAX_CATEGORIES) {
        const extra = CATEGORIES.splice(MAX_CATEGORIES);
        const lastCards = extra.flatMap(c => c.cards);
        CATEGORIES[MAX_CATEGORIES - 1].cards.push(...lastCards);
    }
    // Pad/truncate to TOTAL_CARDS total
    const usedNames = new Set(CATEGORIES.flatMap(c => c.cards));
    let nextGenericIdx = 1;
    function genericName() {
        while (usedNames.has('Card ' + nextGenericIdx)) nextGenericIdx++;
        const n = 'Card ' + nextGenericIdx;
        usedNames.add(n); nextGenericIdx++;
        return n;
    }
    // Pad categories that have zero cards with at least one generic card
    CATEGORIES.forEach(c => { if (c.cards.length === 0) c.cards.push(genericName()); });
    // Top up the last category until total reaches TOTAL_CARDS, or trim tail if over
    let total = totalCardCount();
    while (total < TOTAL_CARDS) {
        CATEGORIES[MAX_CATEGORIES - 1].cards.push(genericName());
        total++;
    }
    while (total > TOTAL_CARDS) {
        for (let i = MAX_CATEGORIES - 1; i >= 0 && total > TOTAL_CARDS; i--) {
            while (CATEGORIES[i].cards.length > 1 && total > TOTAL_CARDS) {
                CATEGORIES[i].cards.pop();
                total--;
            }
        }
        break; // safety
    }
}

rebuildAllCards();

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
// cellState[card][col]: col 0-5 maps to table columns 0-5
// { check, cross, asked, showed, shownToMe, iShowedMe }
let cellState    = {};
let gameLog      = [];
let liveLogEntry = null; // current turn's log entry, shown live before Next Player
let turnOrder    = [];   // array of col indices in play order, e.g. [0,1,2,3]
let turnStep     = 0;    // index into turnOrder for whose turn it is
let turnCount    = 1;
let meCol        = -1;   // which col index is "Me"
let meOriginalName = '';  // M10/Me: the suspect name that was in meCol's header before we overwrote it with "Me"
let gamePhase    = 'setup'; // 'setup' | 'play'
let undoStack    = [];
let typingUndoStack = []; // [{type, ...}] for in-step Undo Typing — cleared on step change
let solutionCards= new Set();

// Pending this turn
let pendingAsked       = []; // [{card,col}] while Shift held
let committedAsked     = []; // [{card,col}] after Shift released
let committedAskedUndo = []; // [{card,col,old}] for undo
let committedShowedUndo= []; // [{card,col,old}] for undo — S marks + auto-✗ from header click
let committedAltUndo   = []; // [{card,col,old}] for undo — Alt+click shown/showed marks
let pendingShowed      = []; // [{card,col,committed}]
let showerUndoArmed    = -1;  // col armed for shower-undo confirm; 2nd tap arms, 3rd tap reverts
let showerUndoTimer    = null; // 5s auto-disarm timer for the shower-undo confirm
function clearShowerUndoArm() {
    showerUndoArmed = -1;
    if (showerUndoTimer) { clearTimeout(showerUndoTimer); showerUndoTimer = null; }
}
let pendingShownMe     = []; // [{card,col,player}] Alt+click other col
let pendingIShowed     = []; // [{card,col,toPlayer}] Alt+click me col
let shiftActive        = false;

// ═══════════════════════════════════════════════════════════════════
// INIT STATE
// ═══════════════════════════════════════════════════════════════════
function initState() {
    ALL_CARDS.forEach(card => {
        cellState[card] = {};
        for (let i = 0; i < MAX_PLAYERS; i++)
            cellState[card][i] = { check:false, cross:false, asked:false, showed:false, shownToMe:false, iShowedMe:false, marks:[] };
    });
}

// ═══════════════════════════════════════════════════════════════════
// M5+: TURN TAG MODEL — every mark carries the turn it was placed on
// ═══════════════════════════════════════════════════════════════════
function currentTurnTag() {
    // Setup = 0, otherwise the current turn number
    return gamePhase === 'setup' ? 0 : turnCount;
}

// Push a mark to a cell's history list AND keep the boolean flag in sync
// (booleans are kept as a quick "does this cell have any mark of type X" cache).
//
// Patrick's rule:
//   • ✓ (check), ✗ (cross), and ! (showed) are SINGLE — first one wins,
//     no stacking; later attempts of the same type are skipped.
//   • ? (asked), ←Me (iShowedMe), ✓* (shownToMe) STACK —
//     every occurrence is recorded. (Internally each mark stores the turn it
//     was placed on, used by Undo; not shown in the UI.)
function markCell(card, col, type, extra = {}) {
    const cs = cellState[card] && cellState[card][col];
    if (!cs) return;
    if (!Array.isArray(cs.marks)) cs.marks = [];
    // First-mark-wins for the SINGLE types: ✓, ✗, !
    if ((type === 'check' || type === 'cross' || type === 'showed') && cs.marks.some(m => m.type === type)) return;
    // M11/01: While a cell is under a manual override (cycle in progress),
    // never let the engine add a contradicting check/cross. Manual wins.
    if (cs.manualStage && (type === 'check' || type === 'cross') &&
        cs.marks.some(m => (m.type === 'check' || m.type === 'cross') && m.manual)) return;
    // Mobile parity: once a ✓ or ✗ is on the cell, no further "!" (showed) marks
    // land — the confirmed yes/no already tells the story; "!" would be noise.
    // "?" still stacks — recording that the cell was asked again is useful history.
    if (type === 'showed' && cs.marks.some(m => m.type === 'check' || m.type === 'cross')) return;
    // Per-turn dedupe for the stacking types — same type can't land twice on the same cell
    // on the same turn (asked/shownToMe/iShowedMe all gated this way; mirrors mobile).
    if (type !== 'check' && type !== 'cross' &&
        cs.marks.some(m => m.type === type && m.turn === currentTurnTag())) return;
    cs.marks.push({ type, turn: currentTurnTag(), ...extra });
    cs[type] = true;
}

// Recompute boolean flags from a cell's marks list — used after undo trims marks.
function recomputeCellBooleans(card, col) {
    const cs = cellState[card] && cellState[card][col];
    if (!cs) return;
    const marks = cs.marks || [];
    cs.check     = marks.some(m => m.type === 'check');
    cs.cross     = marks.some(m => m.type === 'cross');
    cs.asked     = marks.some(m => m.type === 'asked');
    cs.showed    = marks.some(m => m.type === 'showed');
    cs.shownToMe = marks.some(m => m.type === 'shownToMe');
    cs.iShowedMe = marks.some(m => m.type === 'iShowedMe');
}

// ═══════════════════════════════════════════════════════════════════
// M11/01 + M11/04: MANUAL MARK CYCLE (right-click on a player×card cell)
//
// Each right-click advances a 4-state cycle on the cell's DISPLAY ONLY:
//     null → 'blank' → 'cross' → 'check' → null (return to auto-engine state)
// • No row propagation happens during the cycle — just this one cell's glyph
//   updates. The engine's deductions on other cells stay untouched while you
//   click around.
// • Propagation runs on COMMIT, which fires on mouseleave (commitManualCycle).
//   If your final state differs from the cell's pre-cycle engine state, the
//   commit propagates (✓ runs the row sweep) and the log entry is added.
// • If your final state matches the pre-cycle state, the commit is a no-op:
//   no propagation, no log entry, any prior commit's propagation is undone.
// • cs.manualUndoList carries the cells we ✗'d on the previous commit so we
//   can revert them on a future cycle's first right-click.
// ═══════════════════════════════════════════════════════════════════
function cycleManualMark(card, col) {
    const cs = cellState[card] && cellState[card][col];
    if (!cs) return;
    // Guard rails — match the gameplay-cell rules.
    if (gamePhase !== 'play') return;
    if (col === meCol) return;                   // Me column is off-limits
    if (!turnOrder.includes(col)) return;        // empty column
    if (!isRowActive(card)) return;              // #10: muted row (card or category)

    // First right-click of a new cycle (no active stage): reset the row by
    // undoing any prior committed propagation, and snapshot/restore the
    // engine baseline for THIS cell.
    if (cs.manualStage === undefined || cs.manualStage === null) {
        if (cs.manualUndoList && cs.manualUndoList.length) {
            cs.manualUndoList.forEach(undoEntry);
            cs.manualUndoList = null;
        }
        if (!cs.manualSnapshot) {
            cs.manualSnapshot = snapshotCell(cs);
        } else {
            applyCellSnapshot(cs, cs.manualSnapshot);
        }
    }

    // Advance the stage and update the cell glyph only — no row sweep.
    const stage = cs.manualStage || null;
    let nextStage;
    if (stage === null) {
        // engine snapshot → blank
        cs.marks = (cs.marks || []).filter(m => m.type !== 'check' && m.type !== 'cross');
        cs.check = false; cs.cross = false;
        nextStage = 'blank';
    } else if (stage === 'blank') {
        cs.marks = (cs.marks || []).filter(m => m.type !== 'check' && m.type !== 'cross');
        cs.marks.push({ type: 'cross', turn: currentTurnTag(), manual: true });
        cs.cross = true; cs.check = false;
        nextStage = 'cross';
    } else if (stage === 'cross') {
        cs.marks = (cs.marks || []).filter(m => m.type !== 'check' && m.type !== 'cross');
        cs.marks.push({ type: 'check', turn: currentTurnTag(), manual: true });
        cs.check = true; cs.cross = false;
        nextStage = 'check';
    } else if (stage === 'check') {
        // back to engine snapshot
        applyCellSnapshot(cs, cs.manualSnapshot);
        nextStage = null;
    }
    cs.manualStage = nextStage;
    renderCell(card, col);
    autoSave();
}

// Commit fires when the user's mouse leaves the cell during a cycle. We
// compare the final cell state to the engine snapshot and either propagate
// (now ✓), drop everything (same as engine), or just log+keep (now ✗/blank
// without propagation).
function commitManualCycle(card, col) {
    const cs = cellState[card] && cellState[card][col];
    if (!cs) return;
    if (cs.manualStage === undefined) return; // no active cycle

    const snap = cs.manualSnapshot;
    if (!snap) { cs.manualStage = undefined; return; }

    const changed = (cs.check !== snap.check) || (cs.cross !== snap.cross);

    if (!changed) {
        // Full revert. Drop log, undo any prior propagation, clear all state.
        if (cs.manualUndoList && cs.manualUndoList.length) {
            cs.manualUndoList.forEach(undoEntry);
            cs.manualUndoList = null;
        }
        logManualMark(card, col, 'revert');
        cs.manualStage = undefined;
        cs.manualSnapshot = null;
        renderFullLog();
        autoSave();
        return;
    }

    // Final state differs from snapshot. Undo any previous propagation first,
    // so a re-cycle from ✓ → blank cleanly clears the prior row sweep.
    if (cs.manualUndoList && cs.manualUndoList.length) {
        cs.manualUndoList.forEach(undoEntry);
        cs.manualUndoList = null;
    }

    // If we're committing a ✓, run the row sweep and capture an undoList.
    if (cs.check) {
        cs.manualUndoList = propagateRowCross(card, col);
    }

    const action = cs.check ? 'check' : (cs.cross ? 'cross' : 'blank');
    logManualMark(card, col, action);

    cs.manualStage = undefined;  // cycle complete; snapshot+undoList persist
    renderFullLog();
    autoSave();
}

// ─── Cell snapshot / restore helpers (shared by manual-cycle and undo) ───
function snapshotCell(cs) {
    return {
        check:      cs.check,      cross:     cs.cross,
        asked:      cs.asked,      showed:    cs.showed,
        shownToMe:  cs.shownToMe,
        iShowedMe:  cs.iShowedMe,
        marks:      (cs.marks || []).map(m => ({ ...m })),
    };
}
function applyCellSnapshot(cs, snap) {
    cs.check      = snap.check;
    cs.cross      = snap.cross;
    cs.asked      = snap.asked;
    cs.showed     = snap.showed;
    cs.shownToMe  = snap.shownToMe;
    cs.iShowedMe  = snap.iShowedMe;
    cs.marks      = snap.marks.map(m => ({ ...m }));
}
function undoEntry(entry) {
    const target = cellState[entry.card] && cellState[entry.card][entry.col];
    if (!target) return;
    applyCellSnapshot(target, entry.old);
    renderCell(entry.card, entry.col);
}

// Apply ✗ across the rest of the player row for `card`, capture an undo list.
// Used by both manual ✓ commit (M11/01) and room ✓ commit (M11/03), so a
// later revert can roll the row back precisely.
function propagateRowCross(card, sourceCol) {
    const undoList = [];
    turnOrder.forEach(c => {
        if (c === sourceCol)         return;
        if (c === meCol)             return;
        const s = cellState[card] && cellState[card][c];
        if (!s) return;
        if (s.shownToMe || s.check || s.cross) return;
        undoList.push({ card, col: c, old: snapshotCell(s) });
        markCell(card, c, 'cross');
        renderCell(card, c);
    });
    return undoList;
}

// M11/01 (revised M12): The Log is a true log. A manual commit replaces only
// this cell's manual entry from the CURRENT turn (re-commits within a turn
// collapse to one entry); manual entries from earlier turns are history and
// stay put — only a full Undo removes them. A revert removes the current
// turn's entry (if any) and pushes nothing.
function logManualMark(card, col, action) {
    gameLog = gameLog.filter(e => !(e.manual && e.manualCard === card && e.playerIdx === col && e.turn === turnCount));
    if (action === 'revert') return;
    gameLog.push({
        turn: turnCount,
        playerIdx: col,
        player: getColName(col),
        isMe: (col === meCol),
        manual: true,
        manualAction: action,  // 'blank' | 'cross' | 'check'
        manualCard: card,
    });
}

// ═══════════════════════════════════════════════════════════════════
// BUILD TABLE
// ═══════════════════════════════════════════════════════════════════
function buildTable() {
    const tbody = document.getElementById('cardBody');
    if (!tbody) return;
    tbody.innerHTML = '';
    CATEGORIES.forEach((cat, catIdx) => {
        const catActive = isCategoryActive(catIdx);

        // Category banner row — confined to the Card column.
        // First cell: Card column only, holds the Category name + right-click menu.
        // Second cell: spans ∑ + 6 player columns as inert background (same banner color).
        const hRow = document.createElement('tr');
        hRow.className = 'cat-row' + (catActive ? '' : ' row-muted');
        hRow.dataset.catIdx = catIdx;
        const catClass = CAT_CSS_CLASSES[catIdx % CAT_CSS_CLASSES.length];
        const hTd = document.createElement('td');
        hTd.className = 'cat-cell ' + catClass;
        hTd.dataset.catIdx = catIdx;
        renderCategoryBanner(hTd, catIdx);
        hRow.appendChild(hTd);
        const hBlank = document.createElement('td');
        hBlank.className = 'cat-blank ' + catClass;
        // M11/03: bumped 7→8 to span the new Room column (sits between ∑ and players).
        hBlank.colSpan = 8;
        hRow.appendChild(hBlank);
        hRow.addEventListener('contextmenu', e => onContextMenu(e, { kind:'banner', catIdx }));
        tbody.appendChild(hRow);

        // Card rows in this category
        cat.cards.forEach((card, cardIdxInCat) => {
            const cardActive = isCardActive(card);
            const row = document.createElement('tr');
            row.dataset.card = card;
            row.dataset.catIdx = catIdx;
            row.dataset.cardIdxInCat = cardIdxInCat;
            if (!cardActive || !catActive) row.classList.add('row-muted');

            // Card name TH
            const th = document.createElement('th');
            th.dataset.card = card;
            th.dataset.catIdx = catIdx;
            renderCardLabel(th, card);
            // Right-click on the card NAME only — not on player cells or summary
            th.addEventListener('contextmenu', e => onContextMenu(e, { kind:'card', catIdx, cardIdxInCat, card }));
            row.appendChild(th);

            // Summary cell (∑) — M4 manual marking: click to cycle blank → ✕ → ✓ → blank
            const sumTd = document.createElement('td');
            sumTd.className = 'sum-col';
            sumTd.dataset.card = card;
            const sumInner = document.createElement('div'); sumInner.className = 'cell-inner';
            sumTd.appendChild(sumInner);
            sumTd.addEventListener('click', () => {
                // M10/Cleanup: Σ column is play-only. During Setup the marks
                // wouldn't mean anything yet, so clicks do nothing.
                if (gamePhase !== 'play') return;
                if (!isRowActive(card)) return;   // #10: muted rows take no ∑ marks
                cycleSummaryMark(card);
                renderSummaryCell(card);
                autoSave();
            });
            row.appendChild(sumTd);

            // M11/03: Room column — narrow, sits immediately RIGHT of ∑.
            //   Binary toggle: blank ↔ √. When √, the engine treats the card as
            //   on the board in a 2-player-variant room: nobody holds it, and
            //   it's not the secret answer. Play mode only — clicks in Setup
            //   do nothing (matching ∑'s behavior).
            const roomTd = document.createElement('td');
            roomTd.className = 'room-col';
            roomTd.dataset.card = card;
            const roomInner = document.createElement('div'); roomInner.className = 'cell-inner';
            roomTd.appendChild(roomInner);
            roomTd.addEventListener('click', () => {
                if (gamePhase !== 'play') return;
                if (!isRowActive(card)) return;   // #10: covers category mutes too
                toggleRoomDisplay(card);
            });
            // M11/04: Commit the room cycle on mouseleave — propagation and
            //   log entry land here, not on the click.
            roomTd.addEventListener('mouseleave', () => {
                if (gamePhase !== 'play') return;
                commitRoomCycle(card);
            });
            row.appendChild(roomTd);

            // Player columns
            for (let col = 0; col < MAX_PLAYERS; col++) {
                const td = document.createElement('td');
                td.dataset.card = card; td.dataset.col = col;
                td.addEventListener('click', onCellClick);
                td.addEventListener('contextmenu', e => {
                    e.preventDefault();
                    if (enginePlaying()) {
                        openCellCharacters(card, col);
                        return;
                    }
                    // M11/01: Right-click on a player×card cell drives the manual
                    // mark cycle (blank → ✗ → ✓ → return-to-auto-state → blank …).
                    // Game mode only, and never on the Me column.
                    if (gamePhase !== 'play') return;
                    if (col === meCol) return;
                    cycleManualMark(card, col);
                });
                // M11/04: Commit the cycle when the mouse leaves the cell.
                //   Propagation (and the log entry) happens here, not during
                //   the right-click cycle itself.
                td.addEventListener('mouseleave', () => {
                    if (gamePhase !== 'play') return;
                    if (col === meCol) return;
                    commitManualCycle(card, col);
                });
                const inner = document.createElement('div'); inner.className = 'cell-inner';
                td.appendChild(inner);
                row.appendChild(td);
            }

            tbody.appendChild(row);
        });
    });
    requestRowSize();
    applyPlayerColOrder();
}

// Render a category banner — editable input in setup, plain text in play.
function renderCategoryBanner(td, catIdx) {
    td.innerHTML = '';
    const cat = CATEGORIES[catIdx];
    if (!cat) return;
    if (gamePhase === 'setup') {
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 24;
        input.className = 'cat-name-input';
        input.spellcheck = false;
        input.title = 'Category name';
        // M10/Cleanup: Belt-and-suspenders — suppress the input's own browser context
        // menu directly. The event still bubbles up to the row's contextmenu handler
        // (which decides whether to open OUR menu based on the active setup step).
        input.addEventListener('contextmenu', e => e.preventDefault());
        // Category names stay as they are. Only a card's name can be changed.
        input.disabled = true;
        // M5+: if still using the generic default name, render it as a placeholder so it vanishes on focus.
        const isGeneric = /^Category \d+$/.test(cat.name);
        if (isGeneric) { input.value = ''; input.placeholder = cat.name; }
        else           { input.value = cat.name; }
        let renamed = false;
        const doRename = () => {
            if (renamed) return;
            renamed = true;
            // Category names are only editable in setup. If a stale input survives
            // into play (e.g. from a deferred re-render), refuse to mutate cat.name
            // and just re-render to plain text.
            if (gamePhase !== 'setup') {
                renderCategoryBanner(td, catIdx);
                return;
            }
            const typed = input.value.trim();
            const newName = typed || cat.name; // empty input keeps the existing (or generic) name
            // Typing-undo capture — push BEFORE we mutate cat.name so applyTypingUndo can restore it.
            if (newName !== cat.name) {
                pushTypingUndo({ type:'cat-name', catIdx, oldValue: cat.name });
            }
            cat.name = newName;
            renderCategoryBanner(td, catIdx);
            autoSave();
        };
        input.addEventListener('change', doRename);
        input.addEventListener('blur', doRename);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
        // Banner is confined to the Card column — drop the wide "— … —" decoration.
        td.appendChild(input);
    } else {
        td.textContent = cat.name;
    }
}

// Render card label — editable input in setup, plain text in play
function renderCardLabel(th, card) {
    th.innerHTML = '';
    if (gamePhase === 'setup') {
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 24;
        input.className = 'card-name-input';
        input.spellcheck = false;
        input.title = 'Click to rename this card (max 24 chars)';
        // M10/Cleanup: Belt-and-suspenders — suppress the input's own browser
        // context menu directly; let the bubbled event reach the row handler.
        input.addEventListener('contextmenu', e => e.preventDefault());
        // M5+: if this card still has its generic default name, render it as a placeholder.
        const isGeneric = /^Card \d+$/.test(card);
        if (isGeneric) { input.value = ''; input.placeholder = card; }
        else           { input.value = card; }
        // Use a flag to prevent double-firing blur+change
        let renamed = false;
        const doRename = () => {
            if (renamed) return;
            renamed = true;
            const newName = input.value.trim();
            // Typing-undo capture — push BEFORE renameCard mutates the data model.
            if (gamePhase === 'setup' && newName && newName !== card) {
                let catIdx = -1, cardIdx = -1;
                for (let i = 0; i < CATEGORIES.length; i++) {
                    const idx = CATEGORIES[i].cards.indexOf(card);
                    if (idx >= 0) { catIdx = i; cardIdx = idx; break; }
                }
                if (catIdx >= 0) {
                    pushTypingUndo({ type:'card-name', catIdx, cardIdx, oldValue: card });
                }
            }
            renameCard(th, card, newName);
        };
        input.addEventListener('change', doRename);
        input.addEventListener('blur', doRename);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
        th.appendChild(input);
    } else {
        th.textContent = card;
    }
}

function renameCard(th, oldName, newName) {
    if (!newName || newName === oldName) {
        // Revert to old name if empty
        renderCardLabel(th, oldName);
        return;
    }
    // Find the card across all CATEGORIES and rename it
    let found = false;
    for (const cat of CATEGORIES) {
        const idx = cat.cards.indexOf(oldName);
        if (idx >= 0) { cat.cards[idx] = newName; found = true; break; }
    }
    if (!found) { renderCardLabel(th, oldName); return; }
    rebuildAllCards();

    // Update cellState key
    if (cellState[oldName]) {
        cellState[newName] = cellState[oldName];
        delete cellState[oldName];
    }
    // Carry muted state across the rename
    if (mutedCards.has(oldName)) {
        mutedCards.delete(oldName);
        mutedCards.add(newName);
    }
    // M11/03: carry room-checked state across the rename
    if (roomChecked.has(oldName)) {
        roomChecked.delete(oldName);
        roomChecked.add(newName);
    }
    solutionCards.delete(oldName);

    // Update td data-card attributes in this row
    th.dataset.card = newName;
    const row = th.parentElement;
    if (row) {
        row.dataset.card = newName;
        row.querySelectorAll('td[data-card]').forEach(td => td.dataset.card = newName);
    }

    renderCardLabel(th, newName);
    autoSave();
}

// Lock card name inputs when game starts, unlock when editing setup
function updateCardLabels() {
    document.querySelectorAll('tbody tr th[data-card]').forEach(th => {
        renderCardLabel(th, th.dataset.card);
    });
}

// Lock category banner inputs when game starts, unlock when editing setup.
// Mirrors updateCardLabels — the banner is editable in setup, plain text in play.
function updateCategoryBanners() {
    document.querySelectorAll('tr.cat-row td.cat-cell').forEach(td => {
        const catIdx = parseInt(td.dataset.catIdx);
        if (!isNaN(catIdx)) renderCategoryBanner(td, catIdx);
    });
}

// ═══════════════════════════════════════════════════════════════════
// NEWER RULES — the turn, once the game has started
// ═══════════════════════════════════════════════════════════════════
// The page still gathers the players and the cards. Start Game
// hands that started game to the newer rules. From then on, a tap
// on a card, a tap on a name, and Next follow those rules, and the
// sheet draws the marks they return.

let engineShowerArm = -1;

function enginePlaying() {
    return gamePhase === 'play'
        && typeof Engine !== 'undefined'
        && Engine.inspect().gameInProgress;
}

// Whose column the turn belongs to, read from the engine the same
// way the phone page reads it. During a guess it stays on the
// asker. Otherwise it is whoever the engine's turn step names.
function engineAskerCol() {
    if (typeof Engine === 'undefined') return -1;
    const s = Engine.inspect();
    if (!s.gameInProgress || !s.activePlayers.length) return -1;
    if (s.pendingAskerCol >= 0) return s.pendingAskerCol;
    return s.activePlayers[s.turnStep % s.activePlayers.length];
}

// The page paints what the engine reports. The engine's own save
// uses one key, set here, so a refresh can read the same record
// Start Game writes.
function attachEngine() {
    Engine.connect({
        status(msg) { showStatus(msg, 'var(--red-lt)'); },
        turnChanged() {
            applyActiveTurnStyling();
            showEngineNow();
        },
        logChanged() {
            renderFullLog();
        }
    });
    Engine.testing.useStorageKey('ctsWebGame');
}

function handGameToNewerRules() {
    const names = getPlayerNames();
    const mine = ALL_CARDS.filter(card =>
        cellState[card] && cellState[card][meCol] && cellState[card][meCol].check);
    attachEngine();
    Engine.testing.reset({
        categories: CATEGORIES.map(c => ({ name: c.name, cards: c.cards.slice() })),
        players: [0, 1, 2, 3, 4, 5].map(i => names[i] || ''),
        meSlot: meCol,
        myCards: mine.slice(),
        activePlayers: turnOrder.slice(),
        turnCount: 0,
        turnStep: 0,
        gamePhase: 'asking',
        gameInProgress: true
    });
    mine.forEach(card => Engine.testing.placeMark(card, meCol, 'check'));
    ALL_CARDS.forEach(card => {
        if (!mine.includes(card)) Engine.testing.placeMark(card, meCol, 'cross');
    });
    Engine.testing.setTurn(1);
    engineShowerArm = -1;
    renderAllCells();
    showEngineNow();
    applyActiveTurnStyling();
}

function showEngineNow() {
    const view = Engine.logView();
    const s = Engine.inspect();
    const prefix = document.getElementById('phasePrefix');
    const directive = document.getElementById('phaseDirective');
    const deck = document.getElementById('deckBarDirective');
    const asker = engineAskerCol();
    if (prefix) prefix.textContent = 'Game · Turn ' + s.turnCount;
    // A hint or warning owns this line until it clears. The turn
    // name comes back then. It must not wipe the warning.
    if (directive && !gameRowMessage) {
        directive.textContent = asker === s.meSlot
            ? 'Your turn'
            : ((s.players[asker] || 'Player') + "'s turn");
    }
    if (deck && view.now) deck.textContent = view.now;
    renderFullLog();
}

function renderEngineMark(td, card, col) {
    const inner = td.querySelector('.cell-inner');
    if (!inner) return;
    const marks = Engine.visibleMarks(card, col);
    const glyph = {
        check: ['✓', 'sym-check'],
        cross: ['✗', 'sym-cross'],
        asked: ['?', 'sym-asked'],
        showed: ['!', 'sym-showed'],
        ishowed: ['Me', 'sym-meshowed']
    };
    inner.innerHTML = '';
    td.classList.toggle('cell-check', marks.some(m => m.type === 'check'));
    td.classList.toggle('cell-cross', marks.some(m => m.type === 'cross') && !marks.some(m => m.type === 'check'));
    marks.forEach(m => {
        const look = glyph[m.type];
        if (!look) return;
        const wrap = document.createElement('span');
        wrap.className = 'mk';
        const sym = document.createElement('span');
        sym.className = look[1];
        sym.textContent = look[0];
        wrap.appendChild(sym);
        inner.appendChild(wrap);
    });
    const note = Engine.cellNote(card, col);
    if (note) {
        const n = document.createElement('span');
        n.className = 'cell-note';
        n.textContent = note;
        inner.appendChild(n);
    }
}

// A right-click during a game types up to four characters into that
// cell. They sit in the corner. The engine stores them and does
// not use them. Undo does not remove them, and they are not logged.
function openCellCharacters(card, col) {
    if (!enginePlaying()) return;
    if (!turnOrder.includes(col)) return;
    if (!isRowActive(card)) return;
    modalPrompt({
        title: card + ' — ' + getColName(col),
        defaultValue: Engine.cellNote(card, col),
        maxLength: 4,
        placeholder: 'Up to 4 characters',
        okLabel: 'Save',
        onSubmit: (val) => {
            if (val === null) return;
            if (Engine.setCellNote(card, col, val)) renderCell(card, col);
        }
    });
}

function openEngineCardPicker(title, intro, cards, onPick) {
    const wrapper = document.createElement('div');
    const lead = document.createElement('div');
    lead.style.marginBottom = '12px';
    lead.textContent = intro;
    wrapper.appendChild(lead);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; justify-content:center;';
    cards.forEach(card => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-gold';
        btn.style.cssText = 'font-size:1rem; padding:8px 16px;';
        btn.textContent = card;
        btn.onclick = () => { hideModal(); onPick(card); };
        row.appendChild(btn);
    });
    wrapper.appendChild(row);
    showModal({ title: title, body: wrapper, buttons: [{ label: 'Cancel', action: hideModal }] });
}

function playHeaderThroughEngine(col) {
    const road = Engine.headerTap(col);
    if (!road || road.road === 'refused') {
        renderAllCells();
        showPlayHint('header', col);
        return;
    }
    if (road.road === 'correct') {
        if (engineShowerArm !== col) {
            engineShowerArm = col;
            showStatus('Tap that player again to take back the show.', 'var(--red-lt)');
            return;
        }
        engineShowerArm = -1;
        Engine.correctShower();
        renderAllCells();
        showEngineNow();
        return;
    }
    engineShowerArm = -1;
    if (road.road === 'shownme') {
        openEngineCardPicker('Shown to you', 'Which card did they show you?', road.cards, card => {
            Engine.confirmShownMe(card);
            renderAllCells();
            showEngineNow();
        });
        return;
    }
    if (road.road === 'ishowed') {
        openEngineCardPicker('You showed', 'Which card did you show?', road.cards, card => {
            Engine.confirmIShowed(card);
            renderAllCells();
            showEngineNow();
        });
        return;
    }
    renderAllCells();
    showEngineNow();
}

// ═══════════════════════════════════════════════════════════════════
// RENDER CELL
// ═══════════════════════════════════════════════════════════════════
function renderCell(card, col) {
    const td = document.querySelector(`td[data-card="${CSS.escape(card)}"][data-col="${col}"]`);
    if (!td) return;
    if (enginePlaying()) {
        renderEngineMark(td, card, col);
        return;
    }
    const s = cellState[card][col];
    const inner = td.querySelector('.cell-inner');
    inner.innerHTML = '';

    // M11/10: Pure-visual tint — ✓ cells get a soft green, ✗ cells get a
    //   soft red. ✓ wins if both flags are somehow set. No engine touch.
    td.classList.toggle('cell-check', !!s.check);
    td.classList.toggle('cell-cross', !!s.cross && !s.check);

    // M11/01: Per-cell mini-notes removed — right-click now drives the manual
    // mark cycle (see onCellRightClickManual). Nothing to render here.

    // Render every mark in the cell's history list with its turn tag.
    // For Me's column we still hide '!' (showed) marks — Me's "I showed X" is recorded as ←Player on Me's column.
    const isMeCol = (col === meCol);
    const marks = s.marks || [];
    const hasShownToMe = marks.some(m => m.type === 'shownToMe');
    // M11/11 (revised by M11/19): once the cell carries a definitive ✓ or ✗,
    //   drop only the '!' (showed) glyph — the '?' marks stay visible so the
    //   user keeps the full history of when this card was asked about.
    const hasDefinitive = s.check || s.cross;
    marks.forEach(m => {
        if (isMeCol && m.type === 'showed') return;
        // When ✓* is present on this cell, suppress the plain ✓ (✓* implies it)
        if (m.type === 'check' && hasShownToMe) return;
        if (hasDefinitive && m.type === 'showed') return;
        const wrap = document.createElement('span'); wrap.className = 'mk';
        const sym  = document.createElement('span');
        switch (m.type) {
            case 'check':      sym.className = 'sym-check';    sym.textContent = '✓'; break;
            case 'cross':      sym.className = 'sym-cross';    sym.textContent = '✗'; break;
            case 'asked':      sym.className = 'sym-asked';    sym.textContent = '?'; break;
            case 'showed':     sym.className = 'sym-showed';   sym.textContent = '!'; break;
            case 'shownToMe':  sym.className = 'sym-check';    sym.textContent = '✓'; sym.title = 'Shown to Me'; break;
            case 'iShowedMe':  sym.className = 'sym-meshowed'; sym.textContent = 'Me'; sym.title = 'I showed this card to ' + getColName(col); break;
            default: sym.textContent = '·';
        }
        wrap.appendChild(sym);
        // M11/20 REVERTED (M11/22): turn-tag superscript dropped again — the Log
        //   panel already carries which turn each mark was placed on, so the
        //   in-cell tag was redundant noise. M11/19 (the ? glyph staying visible
        //   even after a ✓/✗ lands) stays in place.
        inner.appendChild(wrap);
    });

    // M5+: automatic all-✗'d row dim removed — a ✓ is its own clear marker, no need to dim the row.
    td.classList.remove('all-xed');
    const row = td.parentElement;
    if (row) { const th = row.querySelector('th'); if (th) th.classList.remove('th-muted'); }
}
function renderAllCells() {
    ALL_CARDS.forEach(card => {
        for (let c = 0; c < MAX_PLAYERS; c++) renderCell(card, c);
        renderSummaryCell(card);
        renderRoomCell(card);  // M11/03
    });
    applyPlayLocks();
    applyBlankColLock();
}

// M4: render the Summary (∑) cell for a single card
function renderSummaryCell(card) {
    const td = document.querySelector(`td.sum-col[data-card="${CSS.escape(card)}"]`);
    if (!td) return;
    const inner = td.querySelector('.cell-inner');
    if (!inner) return;
    inner.innerHTML = '';
    const mark = getSummaryMark(card);
    if (mark === 'x') {
        const sp = document.createElement('span'); sp.className = 'sum-x'; sp.textContent = '✕';
        sp.title = 'Held by a known player'; inner.appendChild(sp);
    } else if (mark === 'check') {
        const sp = document.createElement('span'); sp.className = 'sum-check'; sp.textContent = '✓';
        sp.title = 'The envelope holds this card'; inner.appendChild(sp);
    }
}

// ── When any cell gets ✓, ✗ all other active player columns in that row ──
// ─────────────────────────────────────────────────────────────────────
// Play-phase rule: whenever ✓ lands on a player column, every OTHER
// active column on that row gets ✗ — EXCEPT Me's column (already finalized
// at Start Game) and any cell that already has ✓ / ✓* / ✗ ("unless already Xed").
// Ring-loop ✗ on passers stays on a separate mechanism that DOES stack history.
// ─────────────────────────────────────────────────────────────────────
function applyAutoXOnCheck(card, col) {
    turnOrder.forEach(c => {
        if (c === col)              return; // the column that just got ✓
        if (c === meCol)            return; // Me's column was filled in at Start Game
        const s = cellState[card] && cellState[card][c];
        if (!s) return;
        if (s.shownToMe || s.check || s.cross) return; // unless already marked
        markCell(card, c, 'cross');
        renderCell(card, c);
    });
    updateSolutionFlags([card]);
}

// ═══════════════════════════════════════════════════════════════════
// COLUMN STYLING
// ═══════════════════════════════════════════════════════════════════
function applyMeColStyling() {
    for (let c = 0; c < MAX_PLAYERS; c++) {
        const th = document.getElementById('th' + c);
        const tds = document.querySelectorAll(`td[data-col="${c}"]`);
        if (c === meCol) {
            if (th) th.classList.add('me-col');
            tds.forEach(td => td.classList.add('me-col'));
        } else {
            if (th) th.classList.remove('me-col');
            tds.forEach(td => td.classList.remove('me-col'));
        }
    }
}

// Apply all play-phase locking based on current stage
function applyPlayLocks() {
    if (meCol < 0 || gamePhase !== 'play') {
        // Unlock everything during setup
        for (let c = 0; c < MAX_PLAYERS; c++) {
            const th = document.getElementById('th' + c);
            if (th) th.classList.remove('col-locked');
            document.querySelectorAll(`td[data-col="${c}"]`).forEach(td => td.classList.remove('col-locked'));
        }
        return;
    }

    const isMyTurn   = getCurrentCol() === meCol;
    const inWaiting  = committedAsked.length > 0 && pendingShowed.length === 0 && committedShowedUndo.length === 0 && pendingShownMe.length === 0 && pendingIShowed.length === 0;
    const askedCards = committedAsked.map(p => p.card);
    // Does Me have at least one of the asked cards?
    const meHasAsked = askedCards.some(card => cellState[card][meCol] && cellState[card][meCol].check);

    for (let c = 0; c < MAX_PLAYERS; c++) {
        if (!turnOrder.includes(c)) continue;
        const th  = document.getElementById('th' + c);
        const tds = document.querySelectorAll(`td[data-col="${c}"]`);
        const isMe = (c === meCol);

        if (isMyTurn) {
            if (inWaiting) {
                // My turn waiting — lock Me column entirely
                // Other columns: only unlock cells for the 3 asked cards
                if (isMe) {
                    if (th) th.classList.add('col-locked');
                    tds.forEach(td => td.classList.add('col-locked'));
                } else {
                    if (th) th.classList.remove('col-locked');
                    tds.forEach(td => {
                        const card = td.dataset.card;
                        if (askedCards.includes(card)) td.classList.remove('col-locked');
                        else                           td.classList.add('col-locked');
                    });
                }
            } else {
                // My turn thinking/asking — unlock everything
                if (th) th.classList.remove('col-locked');
                tds.forEach(td => td.classList.remove('col-locked'));
            }
        } else {
            // Other player's turn
            if (inWaiting) {
                if (isMe) {
                    // Me header locked, cells unlocked only for asked cards I have
                    if (th) th.classList.add('col-locked');
                    tds.forEach(td => {
                        const card = td.dataset.card;
                        const s = card ? cellState[card][meCol] : null;
                        if (s && s.check && !s.cross && askedCards.includes(card))
                            td.classList.remove('col-locked');
                        else
                            td.classList.add('col-locked');
                    });
                } else {
                    // Other columns — headers always unlocked, cells locked
                    if (th) th.classList.remove('col-locked');
                    tds.forEach(td => td.classList.add('col-locked'));
                }
            } else {
                // Other player thinking/asking — unlock headers, lock Me ✗ cells only
                if (th) th.classList.remove('col-locked');
                if (isMe) {
                    tds.forEach(td => {
                        const card = td.dataset.card;
                        const s = card ? cellState[card][meCol] : null;
                        if (s && s.cross) td.classList.add('col-locked');
                        else              td.classList.remove('col-locked');
                    });
                } else {
                    tds.forEach(td => td.classList.remove('col-locked'));
                }
            }
        }
    }
}

// Keep for compatibility
function lockMeKnownCells() { applyPlayLocks(); }

// Lock/unlock player headers based on whether they can answer the current 3 asked cards
function applyAnswerLock() {
    for (let c = 0; c < MAX_PLAYERS; c++) {
        const th = document.getElementById('th' + c);
        if (!th) continue;
        if (committedAsked.length === 0 || gamePhase !== 'play') {
            th.classList.remove('col-cannot-answer');
            continue;
        }
        // Check if this player has ✗ on ALL 3 asked cards
        const cannotAnswer = committedAsked.every(p => {
            const s = cellState[p.card][c];
            return s.cross && !s.check && !s.shownToMe;
        });
        if (cannotAnswer && c !== getCurrentCol()) {
            th.classList.add('col-cannot-answer');
        } else {
            th.classList.remove('col-cannot-answer');
        }
    }
}

// Lock inactive (not in turnOrder) columns during game play.
// M10/05: during Setup Step 5 (and onward) and during Play, empty/inactive columns
//   are also HIDDEN entirely via .col-hidden. Setup Steps 1-4 still show all 6 so
//   the user sees every available slot.
// M11/08 + M11/09: in the same hide-mode trigger, also drop muted category & card
//   rows from the grid and switch the table into spacious mode so the remaining
//   active rows + text are ~30% bigger.
function applyBlankColLock() {
    const hideMode = (gamePhase === 'play');
    const names    = getPlayerNames();
    for (let c = 0; c < MAX_PLAYERS; c++) {
        const th = document.getElementById('th' + c);
        const tds = document.querySelectorAll(`td[data-col="${c}"]`);
        const blankByName = !names[c];
        const outOfTurn = gamePhase === 'play' && !blankByName && !turnOrder.includes(c);
        if (outOfTurn) {
            if (th) { th.classList.add('col-blank-locked'); th.classList.remove('col-hidden'); }
            tds.forEach(td => { td.classList.add('col-blank-locked'); td.classList.remove('col-hidden'); });
        } else {
            if (th) { th.classList.remove('col-blank-locked'); th.classList.remove('col-hidden'); }
            tds.forEach(td => { td.classList.remove('col-blank-locked'); td.classList.remove('col-hidden'); });
        }
    }

    // M11/08: hide muted category banner rows + their card rows + individually
    //   muted card rows when hide-mode is on. Steps 1-4 keep them visible (greyed).
    document.querySelectorAll('tr.cat-row').forEach(row => {
        const catIdx = parseInt(row.dataset.catIdx);
        const muted  = mutedCategoryIdxs.has(catIdx);
        row.classList.toggle('row-hidden', hideMode && muted);
    });
    document.querySelectorAll('tr[data-card]').forEach(row => {
        const card   = row.dataset.card;
        const catIdx = parseInt(row.dataset.catIdx);
        const muted  = mutedCards.has(card) || mutedCategoryIdxs.has(catIdx);
        row.classList.toggle('row-hidden', hideMode && muted);
    });

    // M11/09 REVERTED — spacious mode dropped. Hide-mode still controls the
    //   column / row hiding above; just no font/height bump anymore.

    requestRowSize();
}


function requestRowSize() {
    if (requestRowSize.pending) return;
    requestRowSize.pending = true;
    requestAnimationFrame(() => {
        requestRowSize.pending = false;
        sizeGridRows();
    });
}

function sizeGridRows() {
    const wrap = document.querySelector('.table-wrap');
    const table = document.getElementById('clueTable');
    if (!wrap || !table) return;
    const head = table.querySelector('thead tr');
    const cats = [...table.querySelectorAll('tbody tr.cat-row')];
    const cards = [...table.querySelectorAll('tbody tr:not(.cat-row)')];
    if (!head || !cards.length) return;
    head.style.height = '';
    cats.forEach(r => { r.style.height = ''; });
    cards.forEach(r => { r.style.height = ''; });
    const used = head.getBoundingClientRect().height
        + cats.reduce((sum, r) => sum + r.getBoundingClientRect().height, 0);
    const spare = wrap.clientHeight - used;
    if (spare <= 0) return;
    const each = spare / cards.length;
    cards.forEach(r => { r.style.height = each + 'px'; });
    const extra = table.getBoundingClientRect().height - wrap.clientHeight;
    if (extra > 0) {
        const tighter = (spare - extra - 1) / cards.length;
        if (tighter > 0) cards.forEach(r => { r.style.height = tighter + 'px'; });
    }
}
window.addEventListener('resize', requestRowSize);

function applyActiveTurnStyling() {
    document.querySelectorAll('td.active-turn').forEach(td => td.classList.remove('active-turn'));
    // MT#5 — the header cell carries the class too, so the light theme's gold
    // rails start at the player's name. The dark theme has no th.active-turn
    // style, so its header looks unchanged.
    document.querySelectorAll('thead th.active-turn').forEach(th => th.classList.remove('active-turn'));
    if (gamePhase !== 'play') return;
    const currentCol = getCurrentCol();
    document.querySelectorAll(`td[data-col="${currentCol}"]`).forEach(td => td.classList.add('active-turn'));
    const th = document.getElementById('th' + currentCol);
    if (th) th.classList.add('active-turn');
}

function applyColLock(locked) {
    // locked = true means shift mode is active, lock all except current player col
    for (let c = 0; c < MAX_PLAYERS; c++) {
        const th  = document.getElementById('th' + c);
        const tds = document.querySelectorAll(`td[data-col="${c}"]`);
        if (locked && c !== getCurrentCol()) {
            if (th) th.classList.add('col-locked');
            tds.forEach(td => td.classList.add('col-locked'));
        } else {
            if (th) th.classList.remove('col-locked');
            tds.forEach(td => td.classList.remove('col-locked'));
        }
    }
}

// ═══════════════════════════════════════════════════════════════════
// PLAYER / TURN HELPERS
// ═══════════════════════════════════════════════════════════════════
function getPlayerNames() {
    const names = [];
    for (let i = 1; i <= MAX_PLAYERS; i++) {
        const el = document.getElementById('p' + i + 'h');
        names.push(el && el.value.trim() ? el.value.trim() : '');
    }
    return names;
}

function findMeCol() {
    // M10/01: Right-click "I am this suspect" is the primary mechanism for picking Me.
    // If meCol was already explicitly set and that column still has a name, keep it.
    const names = getPlayerNames();
    if (meCol >= 0 && meCol < names.length && names[meCol]) return meCol;
    // Backward compat: legacy decks where the user typed "Me" into a column header.
    for (let i = 0; i < names.length; i++) {
        if (names[i].toLowerCase() === 'me') return i;
    }
    return -1;
}

// M10/01: Explicit Me-pick from the right-click context menu on a player column header.
// Mirrors the legacy "type Me to claim your seat" behavior — the suspect name in this
// column gets replaced with "Me" so the player-name text says "Me" (consistent with all
// existing references to "Me" in code, status messages, tests, and flow docs).
function setMeColExplicit(col) {
    if (gamePhase !== 'setup') return;
    // M11/15: if Me is already claimed on a different column, restore that
    //   column's real suspect name from meOriginalName before swapping. Without
    //   this, the prior Me column gets stranded with "Me" as its label and the
    //   real name is lost.
    // M11/17: also wipe the OLD column's cellState marks — checks placed while
    //   that column was Me. Otherwise they survive the switch, hide through
    //   Step 4 (which doesn't visually surface them on non-Me columns), and
    //   come back when Next returns to Step 5.
    if (meCol >= 0 && meCol !== col) {
        if (meOriginalName) {
            const oldPhEl = document.getElementById('p' + (meCol + 1) + 'h');
            if (oldPhEl) oldPhEl.value = meOriginalName;
        }
        const prevMeCol = meCol;
        Object.keys(cellState).forEach(card => {
            if (cellState[card] && cellState[card][prevMeCol]) {
                cellState[card][prevMeCol] = {
                    check:false, cross:false, asked:false, showed:false,
                    shownToMe:false, iShowedMe:false, marks:[],
                };
            }
        });
        // Re-render the old column so the ✓ glyphs and cell-check tints clear immediately.
        ALL_CARDS.forEach(card => renderCell(card, prevMeCol));
    }
    const phEl = document.getElementById('p' + (col + 1) + 'h');
    const suspectName = phEl ? phEl.value.trim() : 'this player';
    // M10/Me: remember the original suspect name. Autosave preserves it within the
    // session so a page reload doesn't lose who you really are; Save Deck writes
    // it back into the deck's players list so deck files never carry "Me".
    meOriginalName = suspectName;
    if (phEl) phEl.value = 'Me';
    meCol = col;
    applyMeColStyling(); applyInactiveColStyling(); applyBlankColLock();
    updatePhaseBarText();
    updateButtonStates();
    renderInfoBar();
    autoSave();
    showStatus('You are ' + suspectName + '.', 'var(--red-lt)');
}

// Named columns, in the order they are sitting when Setup ends.
function buildTurnOrder() {
    const names = getPlayerNames();
    const order = [];
    playerColOrder.forEach(col => {
        if (names[col] && names[col].trim() !== '') order.push(col);
    });
    return order;
}

function getCurrentCol() {
    if (gamePhase === 'play') {
        const col = engineAskerCol();
        if (col >= 0) return col;
    }
    if (turnOrder.length === 0) return 0;
    return turnOrder[turnStep % turnOrder.length];
}

function getCurrentPlayerName() {
    const names = getPlayerNames();
    return names[getCurrentCol()] || ('Player ' + (getCurrentCol() + 1));
}

function getColName(col) {
    const names = getPlayerNames();
    return names[col] || ('Player ' + (col + 1));
}

function startGame() {
    const mc = findMeCol();
    if (mc < 0) { showStatus('Right-click your own player column to pick yourself as Me first.', 'var(--red-lt)'); return; }
    if (!meCardClicksOk(mc)) {
        const n = playerCardCounts[mc];
        showStatus((typeof n === 'number')
            ? `Click your cards in the Me column first — your card count is ${n}.`
            : 'Click your cards in the Me column first (at least 2).', 'var(--red-lt)');
        return;
    }
    const order = buildTurnOrder();
    if (order.length < 2) { showStatus('Enter at least 2 player names.', 'var(--red-lt)'); return; }
    if (!dealAccountsForEighteen()) {
        showStatus('The players\' card counts and the board must account for 18 cards.', 'var(--red-lt)');
        return;
    }

    meCol     = mc;
    turnOrder = order;
    turnStep  = 0;
    turnCount = 1;
    gamePhase = 'play';
    // Lock name and card-count inputs
    for (let i = 1; i <= MAX_PLAYERS; i++) {
        const elH = document.getElementById('p' + i + 'h');
        const elC = document.getElementById('p' + i + 'c');
        if (elH) elH.disabled = true;
        if (elC) elC.disabled = true;
    }
    for (let c = 0; c < MAX_PLAYERS; c++) {
        const th = document.getElementById('th' + c);
        if (th && turnOrder.includes(c)) th.classList.add('in-play');
    }
    refreshCardCountDisplays();

    applyMeColStyling(); applyInactiveColStyling(); applyBlankColLock();
    applyActiveTurnStyling(); applyPlayLocks();
    updateCardLabels();       // lock card name inputs
    updateCategoryBanners();  // lock category banner inputs
    updateStage();
    // ✗ rest of row for any card Me has, and ✗ Me's column for cards Me doesn't have.
    // These are SETUP-derived marks — even though gamePhase is now 'play',
    // they should carry turn tag 0 because they represent what was known at start.
    ALL_CARDS.forEach(card => {
        if (!isRowActive(card)) return;   // muted rows take no marks
        if (!cellState[card][meCol].check) {
            markCell(card, meCol, 'cross', { turn: 0 });
        } else {
            turnOrder.forEach(c => {
                if (c === meCol) return;
                if (!canAutoX(card, c)) return;
                markCell(card, c, 'cross', { turn: 0 });
            });
        }
    });
    renderAllCells();

    document.getElementById('setupBanner').classList.add('game-on');
    updateDeckBarVisibility();
    updateButtonStates();
    renderInfoBar();
    showStatus('Game started! Good luck 🔍', 'var(--red-lt)');

    handGameToNewerRules();
    applyPlayerColOrder();
}
