// ═══════════════════════════════════════════════════════════════════
// CELL CLICK
// ═══════════════════════════════════════════════════════════════════
function onCellClick(e) {
    e.preventDefault(); e.stopPropagation();
    clearShowerUndoArm();  // any cell tap cancels a pending shower-undo confirm
    const td   = e.currentTarget;
    const card = td.dataset.card;
    const col  = parseInt(td.dataset.col);

    // ── SETUP: only Me column, toggle ✓ ──
    if (gamePhase === 'setup') {
        if (meCol < 0) { showStatus('Right-click your own player column to pick yourself as Me first.', 'var(--red-lt)'); return; }
        if (col !== meCol) { showStatus('During setup, only your "Me" column can be marked.', 'var(--red-lt)'); return; }
        const s = cellState[card][col];
        if (s.check) {
            // Toggle off: drop all 'check' marks and any auto-X effects from this card
            s.marks = (s.marks || []).filter(m => m.type !== 'check');
            recomputeCellBooleans(card, col);
        } else {
            // Me's clicks can't exceed the typed card count (unclicking is
            // free; no count typed = no ceiling).
            const cc = playerCardCounts[col];
            if (typeof cc === 'number' && meSetupCheckCount(col) >= cc) {
                showStatus(`Your card count is ${cc} — unclick a card first.`, 'var(--red-lt)');
                return;
            }
            markCell(card, col, 'check');
        }
        renderCell(card, col);
        updateUndoButton();
        updateButtonStates();   // Start Game gate tracks Me's click count live
        autoSave(); return;
    }

    if (enginePlaying()) {
        if (!turnOrder.includes(col)) return;
        const took = Engine.cellTap(card, col);
        renderAllCells();
        if (!took) {
            showPlayHint('cell');
            return;
        }
        showEngineNow();
        return;
    }

    const currentCol = getCurrentCol();
    const isMyTurn   = (currentCol === meCol);
    const hasAsked   = committedAsked.length > 0;
    const hasShowed  = pendingShowed.length > 0 || committedShowedUndo.length > 0;

    // Block clicks on inactive columns during play
    if (gamePhase === 'play' && !turnOrder.includes(col)) return;

    // Block col-locked cells in JS (CSS has no pointer-events, all blocking is here)
    if (gamePhase === 'play' && td.classList.contains('col-locked')) return;

    // ── THINKING stage: click current player's column = mark Asked ──
    if (!hasAsked && !hasShowed) {
        if (col !== currentCol) {
            showStatus('Click a card in the current player\'s column to mark Asked.', 'var(--red-lt)'); return;
        }
        if (pendingAsked.find(p => p.card === card)) return;
        if (!isRowActive(card)) { showStatus('This card is muted — it isn\'t in play. Muting can only be changed in Setup.', 'var(--red-lt)'); return; }
        const askLimit = activeCategoryCount(); // M2: one card per ACTIVE category

        // M11/18: one guess per ACTIVE category. If a pending ask already exists
        //   in this card's category, REPLACE it — revert the prior cell, drop it
        //   from pendingAsked, then proceed with the new pick.
        const newCatIdx = getCatIdxOf(card);
        const dupIdx = pendingAsked.findIndex(p => getCatIdxOf(p.card) === newCatIdx);
        if (dupIdx >= 0) {
            const prev = pendingAsked[dupIdx];
            cellState[prev.card][prev.col] = { ...prev.old, marks: [...(prev.old.marks || [])] };
            renderCell(prev.card, prev.col);
            const ptd = document.querySelector(`td[data-card="${CSS.escape(prev.card)}"][data-col="${prev.col}"]`);
            if (ptd) ptd.classList.remove('pending-ask');
            pendingAsked.splice(dupIdx, 1);
        } else if (pendingAsked.length >= askLimit) {
            showStatus(`Max ${askLimit} card${askLimit===1?'':'s'} per guess.`, 'var(--red-lt)'); return;
        }

        // Save old state for granular undo
        const old = { ...cellState[card][col], marks:[...(cellState[card][col].marks||[])] };
        markCell(card, col, 'asked');
        renderCell(card, col);
        td.classList.add('pending-ask');
        pendingAsked.push({ card, col, old });
        applyColLock(true);

        // After all category-cards selected — auto-commit and advance to waiting
        // Keep column lock so active turn column stays highlighted
        if (pendingAsked.length === askLimit) {
            // Don't unlock — keep other columns locked during waiting stage
            pendingAsked.forEach(p => {
                committedAskedUndo.push({ card: p.card, col: p.col, old: p.old });
                const ptd = document.querySelector(`td[data-card="${CSS.escape(p.card)}"][data-col="${p.col}"]`);
                if (ptd) ptd.classList.remove('pending-ask');
            });
            committedAsked = [...pendingAsked];
            pendingAsked   = [];

            // Highlight cells with ✓ on asked cards
            committedAsked.forEach(p => {
                for (let c = 0; c < MAX_PLAYERS; c++) {
                    if (!turnOrder.includes(c)) continue;
                    const s = cellState[p.card][c];
                    if (s.check || s.shownToMe) {
                        const htd = document.querySelector(`td[data-card="${CSS.escape(p.card)}"][data-col="${c}"]`);
                        if (htd) htd.classList.add('asked-has-card');
                    }
                }
            });

            // Live log entry
            liveLogEntry = {
                turn: turnCount, playerIdx: currentCol, player: getCurrentPlayerName(),
                isMe: isMyTurn, asked: committedAsked.map(p => p.card),
                showerName: '', shownMe: [], iShowed: [], live: true
            };
            renderFullLog();

            // Push partial snapshot
            pushUndo({ turnStep, turnCount, cellChanges: [...committedAskedUndo],
                solutionCards: new Set(solutionCards), partial: true, stage: 'asked' });

            applyPlayLocks();
        }

        updateModeBar(); updateStage(); updateUndoButton(); applyPlayLocks(); renderInfoBar(); autoSave(); return;
    }

    // ── WAITING stage ──
    // Patrick rule: clicks in any cell do NOT mark a show. The show flows are
    // popup-only — triggered by clicking the appropriate player-name HEADER.
    //   • Me-as-asker: click the shower's name header → popup picks the card.
    //   • Me-as-shower: click Me's own header → popup picks the card.
    // A cell click during WAITING just shows a hint and is ignored otherwise.
    if (hasAsked && !hasShowed) {
        if (isMyTurn) {
            showStatus("Click the name at the top of the column of the player who showed — the popup will ask which card.", 'var(--red-lt)');
        } else {
            showStatus("Click your own 'Me' header to record what you showed — the popup will list your held cards.", 'var(--red-lt)');
        }
        return;
    }
}

// ═══════════════════════════════════════════════════════════════════
// ── Clicking a player name header cell = mark showed (commits immediately) ──
// Player columns can be dragged by their headings in Setup and during play.
// The drag changes where a column sits. The turn order is taken once,
// from that arrangement, when Setup ends and the game starts.
const PLAYER_COL_ORDER_KEY = 'ctsPlayerColOrder';
let playerColOrder = (function () {
    try {
        const saved = JSON.parse(localStorage.getItem(PLAYER_COL_ORDER_KEY));
        if (Array.isArray(saved) && saved.length === MAX_PLAYERS &&
            [...Array(MAX_PLAYERS).keys()].every(n => saved.includes(n))) return saved;
    } catch (e) {}
    return [...Array(MAX_PLAYERS).keys()];
})();
let swallowHeaderClick = false;

function savePlayerColOrder() {
    try { localStorage.setItem(PLAYER_COL_ORDER_KEY, JSON.stringify(playerColOrder)); } catch (e) {}
}

function playerColumnCells(col) {
    const th = document.getElementById('th' + col);
    const tds = [...document.querySelectorAll('#cardBody td[data-col="' + col + '"]')];
    return th ? [th, ...tds] : tds;
}

function applyPlayerColOrder() {
    const order = playerColOrder;
    const header = document.getElementById('headerRow');
    if (header) {
        order.forEach(col => {
            const th = document.getElementById('th' + col);
            if (th) header.appendChild(th);
        });
    }
    document.querySelectorAll('#cardBody tr[data-card]').forEach(row => {
        order.forEach(col => {
            const td = row.querySelector('td[data-col="' + col + '"]');
            if (td) row.appendChild(td);
        });
    });
}

// A dragged column settles into a neighbor's seat when its center
// enters the middle third of that column — a window around the
// mid-line, not a thin edge and not the exact center alone.
function seatLinedUpWith(centerX, dragCol) {
    const idx = playerColOrder.indexOf(dragCol);
    if (idx < 0) return -1;
    if (idx < playerColOrder.length - 1) {
        const th = document.getElementById('th' + playerColOrder[idx + 1]);
        if (th) {
            const r = th.getBoundingClientRect();
            const mid = (r.left + r.right) / 2;
            const halfWindow = (r.right - r.left) / 6;
            if (centerX >= mid - halfWindow) return idx + 1;
        }
    }
    if (idx > 0) {
        const th = document.getElementById('th' + playerColOrder[idx - 1]);
        if (th) {
            const r = th.getBoundingClientRect();
            const mid = (r.left + r.right) / 2;
            const halfWindow = (r.right - r.left) / 6;
            if (centerX <= mid + halfWindow) return idx - 1;
        }
    }
    return -1;
}

function wirePlayerColumnDrag() {
    const header = document.getElementById('headerRow');
    if (!header || header.dataset.dragWired) return;
    header.dataset.dragWired = '1';
    let drag = null;

    const onMove = e => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const dx = e.clientX - drag.anchorX;
        if (!drag.moved) {
            if (Math.abs(dx) < 6) return;
            drag.moved = true;
            drag.cells.forEach(c => c.classList.add('drag-col'));
        }
        drag.cells.forEach(c => { c.style.transform = 'translateX(' + dx + 'px)'; });
        const held = document.getElementById('th' + drag.col);
        if (!held) return;
        const heldBox = held.getBoundingClientRect();
        const centerX = (heldBox.left + heldBox.right) / 2;
        const idx = playerColOrder.indexOf(drag.col);
        const seat = seatLinedUpWith(centerX, drag.col);
        if (seat >= 0 && seat !== idx) {
            playerColOrder.splice(idx, 1);
            playerColOrder.splice(seat, 0, drag.col);
            drag.cells.forEach(c => { c.style.transform = ''; });
            drag.anchorX = e.clientX;
            applyPlayerColOrder();
        }
    };

    const finish = e => {
        if (!drag || (e && e.pointerId !== drag.pointerId)) return;
        const didMove = drag.moved;
        const openField = drag.openField;
        drag.cells.forEach(c => { c.style.transform = ''; c.classList.remove('drag-col'); });
        drag = null;
        if (!didMove) {
            if (openField) openField.focus();
            return;
        }
        const sel = window.getSelection();
        if (sel) sel.removeAllRanges();
        savePlayerColOrder();
        swallowHeaderClick = true;
        setTimeout(() => { swallowHeaderClick = false; }, 0);
    };

    header.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        const th = e.target.closest('th');
        if (!th || !th.id || !th.id.startsWith('th')) return;
        const col = parseInt(th.id.slice(2), 10);
        if (isNaN(col)) return;
        const field = e.target.closest('input');
        const openField = (field && !field.disabled) ? field : null;
        drag = { col, anchorX: e.clientX, moved: false, cells: playerColumnCells(col), pointerId: e.pointerId, openField };
        try { th.setPointerCapture(e.pointerId); } catch (err) {}
        if (openField) e.preventDefault();
    });

    header.addEventListener('pointermove', onMove);
    header.addEventListener('pointerup', finish);
    header.addEventListener('pointercancel', finish);
}
wirePlayerColumnDrag();

document.getElementById('headerRow').addEventListener('click', e => {
    if (swallowHeaderClick) { swallowHeaderClick = false; return; }
    if (gamePhase !== 'play') return;
    // Find the th — target could be text node or input inside
    let th = e.target;
    if (th.tagName !== 'TH') th = th.closest('th');
    if (!th || !th.id || !th.id.startsWith('th')) return;
    const col = parseInt(th.id.replace('th', ''));
    if (isNaN(col)) return;

    // Block inactive columns (not in turnOrder)
    if (!turnOrder.includes(col)) return;

    if (enginePlaying()) {
        playHeaderThroughEngine(col);
        return;
    }

    // Tapping any header other than the armed one cancels a pending shower-undo confirm.
    if (showerUndoArmed !== -1 && showerUndoArmed !== col) clearShowerUndoArm();

    // GUARD (mobile parity): asker cannot also be the shower.
    if (col === getCurrentCol()) {
        showStatus(`${getColName(col)} is asking — cannot also show.`, 'var(--red-lt)');
        return;
    }

    // GUARD #6: clicked column has ✗ on every asked card — they can't be the shower.
    // Applies universally (including Me's column — Me with ✗ on all asked means Me holds none).
    if (committedAsked.length > 0) {
        const allCrossed = committedAsked.every(p =>
            cellState[p.card] && cellState[p.card][col] && cellState[p.card][col].cross
        );
        if (allCrossed) {
            showStatus(`${getColName(col)} has ❌ on all asked cards — cannot show.`, 'var(--red-lt)');
            return;
        }
    }

    // GUARD #2: sequence check. Walking the ring from asker+1, if an earlier player
    // is obligated to show (has ✓ on any asked card) and the clicked column comes
    // after them, reject — the earlier player must show first.
    if (committedAsked.length > 0) {
        const askerCol = getCurrentCol();
        const n        = turnOrder.length;
        const askerIdx = turnOrder.indexOf(askerCol);
        const colIdx   = turnOrder.indexOf(col);
        if (askerIdx >= 0 && colIdx >= 0) {
            const colPos = ((colIdx - askerIdx - 1 + n) % n);
            for (let i = 1; i < n; i++) {
                const c = turnOrder[(askerIdx + i) % n];
                if (c === askerCol)        continue;
                const mustShow = committedAsked.some(p =>
                    cellState[p.card] && cellState[p.card][c] && cellState[p.card][c].check
                );
                if (mustShow) {
                    const mustShowPos = ((turnOrder.indexOf(c) - askerIdx - 1 + n) % n);
                    if (colPos > mustShowPos) {
                        showStatus(`${getColName(c)} must show first — they have a card.`, 'var(--red-lt)');
                        return;
                    }
                    break; // first must-show found; later players are unaffected
                }
            }
        }
    }

    // M5+: Me-as-asker — click another player's header to record they showed
    if (getCurrentCol() === meCol) {
        if (col === meCol) return; // ignore own header on own turn
        if (committedAsked.length === 0) {
            showStatus(`Click ${activeCategoryCount()} cards in your own column first.`, 'var(--red-lt)'); return;
        }
        openMeAskerPicker(col, committedAsked.map(p => p.card));
        return;
    }

    // M5+: Me-as-shower — click Me's own header during another player's turn
    if (col === meCol) {
        if (committedAsked.length === 0) {
            showStatus(`Wait until ${getCurrentPlayerName()} has asked ${activeCategoryCount()} cards.`, 'var(--red-lt)'); return;
        }
        openMeShowerPicker(getCurrentCol(), committedAsked.map(p => p.card));
        return;
    }

    // Block locked headers
    if (th.classList.contains('col-locked')) return;

    // #7: a guess set must be COMPLETE (one card per active category) before
    // a shower can be recorded — the game rules don't allow a partial ask.
    // Covers both no picks yet and a partial set still pending.
    if (committedAsked.length === 0) {
        showStatus(`Click ${activeCategoryCount()} card${activeCategoryCount()===1?'':'s'} in the current player's column first.`, 'var(--red-lt)'); return;
    }

    // Toggle — second tap on the same shower header asks to confirm first;
    // the confirming (third) tap actually reverts. Stops a stray double-tap
    // from silently undoing the shower. Doing anything else cancels the arm.
    if (pendingShowed.length > 0 && pendingShowed[0].col === col) {
        if (showerUndoArmed !== col) {
            showerUndoArmed = col;
            showStatus(`Tap ${getColName(col)} again to remove them as shower.`, 'var(--red-lt)');
            if (showerUndoTimer) clearTimeout(showerUndoTimer);
            showerUndoTimer = setTimeout(clearShowerUndoArm, 5000);
            return;
        }
        clearShowerUndoArm();
        // Full rollback of committed showed + auto-✗
        committedShowedUndo.forEach(({ card, col: c, old }) => {
            cellState[card][c] = { ...old };
            renderCell(card, c);
        });
        committedShowedUndo = [];
        pendingShowed.forEach(p => {
            const td = document.querySelector(`td[data-card="${CSS.escape(p.card)}"][data-col="${p.col}"]`);
            if (td) td.classList.remove('pending-show');
        });
        pendingShowed = [];
        updateModeBar(); updateStage(); renderInfoBar(); return;
    }

    // Clear any previous showed selection — rollback first
    if (pendingShowed.length > 0) {
        committedShowedUndo.forEach(({ card, col: c, old }) => {
            cellState[card][c] = { ...old };
            renderCell(card, c);
        });
        committedShowedUndo = [];
        pendingShowed.forEach(p => {
            const td = document.querySelector(`td[data-card="${CSS.escape(p.card)}"][data-col="${p.col}"]`);
            if (td) td.classList.remove('pending-show');
        });
        pendingShowed = [];
    }

    // Immediately apply S marks and auto-✗ passing players
    const showerCol = col;
    clearShowerUndoArm();     // new shower selection resets the undo-confirm arm
    committedShowedUndo = []; // fresh slate

    committedAsked.forEach(p => {
        // Save old state of shower's cell
        committedShowedUndo.push({ card: p.card, col: showerCol, old: { ...cellState[p.card][showerCol], marks:[...(cellState[p.card][showerCol].marks||[])] } });
        markCell(p.card, showerCol, 'showed');
        renderCell(p.card, showerCol);
        pendingShowed.push({ card: p.card, col: showerCol, committed: true });

        // Auto-✗ players who passed (between asker and shower in turn order)
        const n        = turnOrder.length;
        const askerIdx = turnOrder.indexOf(getCurrentCol());
        let i     = (askerIdx + 1) % n;
        let steps = 0;
        while (turnOrder[i] !== showerCol && steps < n) {
            applyAutoX(p.card, turnOrder[i], committedShowedUndo);
            i = (i + 1) % n;
            steps++;
        }
    });

    // Update live log entry with shower
    if (liveLogEntry) {
        liveLogEntry.showerName = getColName(showerCol);
        renderFullLog();
    }
    updateModeBar(); updateStage(); updateUndoButton(); renderInfoBar(); autoSave();
});

// ═══════════════════════════════════════════════════════════════════
// TURN STAGE INDICATOR
// ═══════════════════════════════════════════════════════════════════
function updateStage() {
    updatePhaseBarText();
    updateButtonStates();
    const el    = document.getElementById('ibStage');
    const nameEl= document.getElementById('ibPlayerName');
    if (!el || gamePhase !== 'play') return;
    const isMe      = (getCurrentCol() === meCol);
    const name      = getCurrentPlayerName();
    const hasShowed = pendingShowed.length > 0;
    const hasAlt    = pendingShownMe.some(p => p.committed) || pendingIShowed.some(p => p.committed);
    const isEndTurn = hasShowed || hasAlt;

    if (pendingAsked.length > 0) {
        if (nameEl) nameEl.textContent = isMe ? 'I' : '▶ ' + name;
        el.className = 'ib-stage guessing';
        el.textContent = isMe ? 'am guessing' : 'is guessing';
    } else if (committedAsked.length > 0 && !isEndTurn) {
        if (nameEl) nameEl.textContent = isMe ? 'I' : '▶ ' + name;
        el.className = 'ib-stage waiting';
        el.textContent = isMe ? 'am waiting' : 'is waiting for answer';
    } else if (isEndTurn) {
        if (nameEl) nameEl.textContent = isMe ? 'Your' : '▶ ' + name + "'s";
        el.className = 'ib-stage endturn';
        el.textContent = 'End of turn';
    } else {
        if (nameEl) nameEl.textContent = isMe ? '🔍 My Turn' : '▶ ' + name;
        el.className = 'ib-stage thinking';
        el.textContent = isMe ? 'others are waiting 🤔' : 'is thinking 🤔';
    }
}
function updateModeBar() {
    const el = document.getElementById('modeText');
    if (!el) return; // M5+: modeText was retired from the Phase Bar refactor — function is now a no-op
    const hasAsk       = pendingAsked.length > 0;
    const hasCommitted = committedAsked.length > 0;
    const hasShow      = pendingShowed.length > 0;
    const hasShownMe   = pendingShownMe.length > 0;
    const hasIShowed   = pendingIShowed.length > 0;

    el.className = 'ibc-mode';
    if (hasAsk) {
        el.className += ' mode-asking';
        el.textContent = `Shift: ${pendingAsked.length}/${activeCategoryCount()} cards — release Shift to log`;
    } else if (hasCommitted && !hasShow) {
        el.className += ' mode-asking';
        el.textContent = `Asked logged (${committedAsked.length}) — click player name who showed, or Next Player`;
    } else if (hasShow) {
        el.className += ' mode-showing';
        el.textContent = `Showed marked — click Next Player to commit`;
    } else if (hasShownMe || hasIShowed) {
        el.className += ' mode-shownme';
        el.textContent = `Alt marked — click Next Player to commit`;
    } else {
        el.textContent = '';
    }
}

// CLEAR PENDING
// ═══════════════════════════════════════════════════════════════════
function clearPending() {
    [...pendingAsked, ...pendingShowed, ...pendingShownMe, ...pendingIShowed].forEach(p => {
        const c = p.col !== undefined ? p.col : 0;
        const td = document.querySelector(`td[data-card="${CSS.escape(p.card)}"][data-col="${c}"]`);
        if (td) td.classList.remove('pending-ask', 'pending-show', 'pending-shownme');
    });
    document.querySelectorAll('td.asked-has-card').forEach(td => td.classList.remove('asked-has-card'));
    pendingAsked = []; committedAsked = []; committedAskedUndo = []; committedShowedUndo = []; committedAltUndo = [];
    pendingShowed = []; pendingShownMe = []; pendingIShowed = [];
    liveLogEntry = null;
    applyColLock(false);
    applyPlayLocks();
    updateModeBar(); updateStage(); updateUndoButton(); renderInfoBar();
}

// ═══════════════════════════════════════════════════════════════════
// AUTO ✗ HELPERS
// ═══════════════════════════════════════════════════════════════════
function canAutoX(card, col) {
    const s = cellState[card][col];
    // Patrick's rule: the first ✗ wins — no stacking. A cell already marked stays as-is.
    if (s.shownToMe) return false; // confirmed shown to me
    if (s.check)     return false; // has this card (includes Me's setup cards)
    if (s.cross)     return false; // already Xed — leave the existing ✗ in place
    return true; // blank, A, S are overwritable
}

function applyAutoX(card, col, undoList) {
    if (!canAutoX(card, col)) return;
    const old = { ...cellState[card][col], marks:[...(cellState[card][col].marks||[])] };
    undoList.push({ card, col, old });
    markCell(card, col, 'cross');
    renderCell(card, col);
}

// ═══════════════════════════════════════════════════════════════════
// SOLUTION FLAGS
// ═══════════════════════════════════════════════════════════════════
function isSolutionCandidate(card) {
    // Nobody holds it, and every House card has been checked.
    // Until the House is full, the card can still be an unseen House card.
    return nobodyHolds(card) && houseFull();
}

function updateSolutionFlags(cards) {
    let changed = false;
    cards.forEach(card => {
        const was = solutionCards.has(card);
        const is  = isSolutionCandidate(card);
        if (is && !was)  { solutionCards.add(card);    changed = true; }
        if (!is && was)  { solutionCards.delete(card); changed = true; }
    });
    if (changed) renderSolutionFlags();
}

function renderSolutionFlags() {
    // M11/05: Card-column solution highlight removed per Patrick — "too much
    //   like thinking." The solutionCards set is still maintained for engine
    //   use (isSolutionCandidate), but no visual flag lands on the card name.
    //   We still STRIP any leftover flag styling so older saves render clean.
    document.querySelectorAll('tbody tr th[data-card]').forEach(th => {
        th.style.color = ''; th.style.fontWeight = '';
        th.classList.remove('sol-flash-green','sol-flash-red');
        const flag = th.querySelector('.sol-flag');
        if (flag) th.removeChild(flag);
    });
}

// ═══════════════════════════════════════════════════════════════════
// UNDO STAGE
// ═══════════════════════════════════════════════════════════════════
function pushUndo(snap) {
    undoStack.push(snap);
    updateUndoButton();
}

function updateUndoButton() {
    // M5+: button is always visible; updateButtonStates handles the enabled/disabled state.
    updateButtonStates();
    updatePhaseBarText();
}

// M5+: scan cellState for any mark with a specific turn tag
function hasMarksForTurn(turn) {
    for (const card of ALL_CARDS) {
        for (let c = 0; c < MAX_PLAYERS; c++) {
            const cs = cellState[card] && cellState[card][c];
            if (!cs) continue;
            if ((cs.marks || []).some(m => m.turn === turn)) return true;
        }
    }
    return false;
}

// M5+: remove all marks with a specific turn tag, then resync booleans
function removeMarksForTurn(turn) {
    ALL_CARDS.forEach(card => {
        for (let c = 0; c < MAX_PLAYERS; c++) {
            const cs = cellState[card] && cellState[card][c];
            if (!cs) continue;
            cs.marks = (cs.marks || []).filter(m => m.turn !== turn);
            recomputeCellBooleans(card, c);
        }
    });
}

function undoStage() {
    // Undo runs the game. Before the game starts there is no step to go back to.
    if (gamePhase === 'setup') {
        showStatus('Nothing more to undo.', 'var(--gold-dk)');
        return;
    }

    // ── Play phase: rewind one whole turn — wrapped in a two-tap confirm (mobile parity) ──
    return _playPhaseUndoEntry();
}

// M11/16: shared setup-undo body — steps back, restores destination snapshot.
function _doSetupUndo() {
    stepSnapshots[setupStep] = captureStepSnapshot();
    setupStep--;
    if (stepSnapshots[setupStep]) {
        restoreStepSnapshot(stepSnapshots[setupStep]);
    } else {
        clearTypingUndo();
    }
    updatePhaseBarText();
    updateButtonStates();
    applyMeColStyling();   // refresh in case meCol changed
    applyBlankColLock();
    showStatus(`Returned to Step ${setupStep}.`, 'var(--text)');
    autoSave();
}

// M11/16: confirmed undo from Step 5 — clears the ephemeral Me state first.
function _doSetupUndoFromStep5() {
    hideModal();
    // Put the real suspect name back into the Me column input before we clear.
    if (meCol >= 0 && meOriginalName) {
        const phEl = document.getElementById('p' + (meCol + 1) + 'h');
        if (phEl) phEl.value = meOriginalName;
    }
    // Wipe the Me column's cellState marks (the cards the user checked in Step 5).
    //   M11/16 follow-up: iterate Object.keys(cellState) instead of ALL_CARDS so
    //   any stale cellState rows that don't appear in the current CATEGORIES
    //   (e.g. after a card-rename round-trip) still get their Me-column wiped.
    if (meCol >= 0) {
        Object.keys(cellState).forEach(card => {
            if (cellState[card] && cellState[card][meCol]) {
                cellState[card][meCol] = {
                    check:false, cross:false, asked:false, showed:false,
                    shownToMe:false, iShowedMe:false, marks:[],
                };
            }
        });
    }
    meCol = -1;
    meOriginalName = '';
    // Drop the Step 5 snapshot so re-entry is a fresh canvas (per Patrick's design).
    delete stepSnapshots[5];
    // Full rebuild + re-render so the cleared Me-column cells repaint with no
    //   leftover ✓ glyphs or cell-check background tints.
    buildTable();
    renderAllCells();
    applyMeColStyling();
    _doSetupUndo();
}

function _playPhaseUndoEntry() {
    const s = Engine.inspect();
    const atStart = s.turnCount <= 1 && s.gamePhase === 'asking' && s.pendingCards.length === 0;
    if (atStart) {
        showStatus('Nothing more to undo.', 'var(--gold-dk)');
        return;
    }
    const midTurn = !(s.gamePhase === 'asking' && s.pendingCards.length === 0);
    modalConfirm({
        title: midTurn ? 'Undo this turn' : 'Previous turn',
        message: midTurn
            ? `Clear all marks placed on turn ${s.turnCount}?`
            : `Roll back to turn ${s.turnCount - 1}?`,
        okLabel: midTurn ? 'Undo' : 'Roll back',
        confirmTwoTap: true,
        onConfirm: () => {
            Engine.undoTap();
            renderAllCells();
            applyActiveTurnStyling();
            showEngineNow();
            updateButtonStates();
        }
    });
}

function nextPlayer() {
    if (gamePhase !== 'play' || !enginePlaying()) return;
    Engine.nextTap();
    renderAllCells();
    applyActiveTurnStyling();
    showEngineNow();
    updateButtonStates();
}

// INFO BAR
// ═══════════════════════════════════════════════════════════════════
function renderInfoBar() {
    const nameEl  = document.getElementById('ibPlayerName');
    const badgeEl = document.getElementById('ibTurnBadge');
    const body    = document.getElementById('infoBarBody');

    // Info Bar retired — its elements no longer exist in the DOM. Bail out early.
    if (!nameEl || !badgeEl || !body) return;

    if (gamePhase === 'setup') {
        nameEl.textContent  = '⚙ Setup';
        badgeEl.textContent = '';
        const stageEl = document.getElementById('ibStage');
        if (stageEl) { stageEl.className = 'ib-stage'; stageEl.textContent = '—'; }
        body.innerHTML = '<div class="info-empty">Enter names, mark your cards, then Start Game.</div>';
        return;
    }

    const currentCol = getCurrentCol();
    const isMe       = (currentCol === meCol);
    const name       = getCurrentPlayerName();
    const isGuessing = pendingAsked.length > 0;
    const isWaiting  = committedAsked.length > 0 && pendingShowed.length === 0;

    if (isMe && (isGuessing || isWaiting)) {
        nameEl.textContent = 'I';
    } else {
        nameEl.textContent = isMe ? '🔍 My Turn' : '▶ ' + name;
    }
    badgeEl.textContent = 'Turn ' + turnCount;
    body.innerHTML = '';

    // Pending chips
    const pendingAskChips = [
        ...pendingAsked.map(p   => ({ label: 'A: '  + p.card, type: 'ask' })),
        ...committedAsked.map(p => ({ label: '✓A: ' + p.card, type: 'ask' })),
    ];
    const pendingShowChips = pendingShowed.length > 0 ? [
        { label: getColName(pendingShowed[0].col) + ' showed one of these:', type: 'show-header' },
        ...pendingShowed.map(p => ({ label: p.card, type: 'show' })),
    ] : [];
    const pendingOtherChips = [
        ...pendingShownMe.map(p => ({ label: '✓: ' + p.card + ' by ' + p.player,   type: 'shownme' })),
        ...pendingIShowed.map(p => ({ label: '→: ' + p.card + ' to ' + p.toPlayer, type: 'shownme' })),
    ];
    const allP = [...pendingAskChips, ...pendingShowChips, ...pendingOtherChips];

    if (allP.length > 0) {
        const pa   = document.createElement('div'); pa.className = 'pending-area';
        const lbl  = document.createElement('div'); lbl.className = 'pa-label'; lbl.textContent = 'Pending this turn:';
        const chips= document.createElement('div'); chips.className = 'pending-chips';
        pa.appendChild(lbl);
        allP.forEach(p => {
            const c = document.createElement('span');
            if (p.type === 'show-header') {
                c.className = 'pchip-show-header';
                c.textContent = p.label;
            } else {
                c.className = 'pchip pchip-' + p.type;
                c.textContent = p.label;
            }
            chips.appendChild(c);
        });
        pa.appendChild(chips); body.appendChild(pa);
    }

    // Filter log entries for this player
    const myEntries = gameLog.filter(e => e.playerIdx === currentCol);

    if (isMe) {
        // ── MY TURN ──
        const allShownMe = gameLog.filter(e => e.shownMe && e.shownMe.length > 0);
        if (allShownMe.length > 0) {
            addLabel(body, 'Was shown:');
            allShownMe.forEach(e => e.shownMe.forEach(s => {
                const div = document.createElement('div'); div.className = 'info-turn-entry';
                div.innerHTML = `<span class="ite-turn">Turn ${e.turn}:</span> <span class="ite-showed">${s.card}</span> by <span class="ite-showed">${s.player}</span>`;
                body.appendChild(div);
            }));
        }

        const allIShowed = gameLog.filter(e => e.iShowed && e.iShowed.length > 0);
        if (allIShowed.length > 0) {
            addLabel(body, 'I showed:');
            allIShowed.forEach(e => e.iShowed.forEach(s => {
                const div = document.createElement('div'); div.className = 'info-turn-entry';
                div.innerHTML = `<span class="ite-turn">Turn ${e.turn}:</span> <span class="ite-cards">${s.card}</span> <span class="ite-meshowed">→ to ${s.toPlayer}</span>`;
                body.appendChild(div);
            }));
        }

        if (allShownMe.length === 0 && allIShowed.length === 0) {
            addEmpty(body, 'No cards shown yet.');
        }

    } else {
        // ── OTHER PLAYER ──
        addLabel(body, 'I showed this player:');
        const iShowedThem = gameLog.filter(e => e.iShowed && e.iShowed.some(s => s.toPlayer === name));
        if (iShowedThem.length === 0) { addEmpty(body, 'Nothing shown yet.'); }
        else {
            iShowedThem.forEach(e => e.iShowed.filter(s => s.toPlayer === name).forEach(s => {
                const div = document.createElement('div'); div.className = 'info-turn-entry';
                div.innerHTML = `<span class="ite-turn">Turn ${e.turn}:</span> <span class="ite-cards">${s.card}</span>`;
                body.appendChild(div);
            }));
        }
    }
}

function addLabel(parent, text) {
    const el = document.createElement('div'); el.className = 'info-section-label'; el.textContent = text; parent.appendChild(el);
}
function addEmpty(parent, text) {
    const el = document.createElement('div'); el.className = 'info-empty'; el.textContent = text; parent.appendChild(el);
}

// FULL GAME LOG
// ═══════════════════════════════════════════════════════════════════
// Helper: get player color class by column index
function playerColorClass(playerIdx) {
    const idx = turnOrder.indexOf(playerIdx);
    return 'pc' + (idx >= 0 ? idx % 6 : 0);
}

function renderEngineLog(list) {
    const view = Engine.logView();
    list.innerHTML = '';
    const entries = view.entries || [];
    if (!view.now && entries.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'color:var(--text-muted);font-style:italic;font-size:0.95rem;padding:6px;';
        empty.textContent = view.empty;
        list.appendChild(empty);
        return;
    }
    if (view.now) {
        const now = document.createElement('div');
        now.className = 'log-entry log-live';
        now.textContent = view.now;
        list.appendChild(now);
    }
    entries.forEach(entry => {
        const div = document.createElement('div');
        const hot = (entry.lines || []).some(ln => ln.highlight);
        div.className = 'log-entry' + (hot ? ' log-live' : '');
        const title = document.createElement('div');
        title.className = 'log-turn';
        title.textContent = entry.title;
        div.appendChild(title);
        (entry.lines || []).forEach(ln => {
            const row = document.createElement('div');
            row.textContent = ln.text;
            div.appendChild(row);
        });
        list.appendChild(div);
    });
}

function renderFullLog() {
    const list = document.getElementById('logList');
    if (enginePlaying()) {
        renderEngineLog(list);
        return;
    }

    const displayEntries = (liveLogEntry
        ? [liveLogEntry, ...[...gameLog].reverse()]
        : [...gameLog].reverse()).filter(e => !e.out);

    if (displayEntries.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted);font-style:italic;font-size:0.95rem;padding:6px;">No turns yet...</div>';
        return;
    }
    list.innerHTML = '';
    displayEntries.forEach(e => {
        const div = document.createElement('div');
        div.className = 'log-entry' + (e.live ? ' log-live' : '');
        const pc = playerColorClass(e.playerIdx);
        const who = e.isMe ? 'Me' : e.player;
        const tLabel = e.live ? 'Now' : 'T' + e.turn;

        let html = `<span class="log-turn">${tLabel}</span> <span class="log-who ${pc}">${who}</span>`;

        // M11/01: Manual mark log entry — flat one-liner, no asked/showed structure.
        if (e.manual) {
            const sym = (e.manualAction === 'check')  ? '<span class="sym-check">✓</span>'
                      : (e.manualAction === 'cross')  ? '<span class="sym-cross">✗</span>'
                      :                                 '<span class="log-nobody">blank</span>';
            html += ` <span class="log-arrow">—</span> <span class="log-asked">${e.manualCard}</span> <span class="log-arrow">→</span> ${sym}`;
            div.innerHTML = html;
            list.appendChild(div);
            return;
        }

        // M11/03: Room mark log entry — "🏠 [card] → ✓" or "blank" (toggle off).
        if (e.room) {
            const sym = '<span class="sym-check">✓</span>';
            html = `<span class="log-turn">${tLabel}</span> <span class="log-who">🏠 House-room</span> <span class="log-arrow">—</span> <span class="log-asked">${e.roomCard}</span> <span class="log-arrow">→</span> ${sym}`;
            div.innerHTML = html;
            list.appendChild(div);
            return;
        }

        // M11/24: no-guess turn — render "did not reach a room."
        if (!e.asked || e.asked.length === 0) {
            html += ` <span class="log-arrow">—</span> <span class="log-nobody">did not reach a room.</span>`;
            div.innerHTML = html;
            list.appendChild(div);
            return;
        }

        // Asked line
        if (e.asked && e.asked.length > 0) {
            html += ` <span class="log-arrow">—</span> <span class="log-asked">${e.asked.join(' · ')}</span>`;

            // Shower on same line — three cases:
            //   (a) Other-shows-other: showerName set, no card visible.
            //         → "Carol showed"
            //   (b) Me showed someone (iShowed): label is "Me", append the card.
            //         → "Me showed Dagger"
            //   (c) Someone showed Me (shownMe): label is the player, append "Me <card>".
            //         → "Bob showed Me Dagger"
            // The per-card breakdown rows below the asked line are intentionally
            // dropped — all the info now lives inline on one row.
            if (e.showerName) {
                const showerCol = turnOrder.find(c => getColName(c) === e.showerName) ?? -1;
                const spc = showerCol >= 0 ? playerColorClass(showerCol) : pc;
                html += ` <span class="log-arrow">→</span> <span class="log-shower ${spc}">${e.showerName} showed</span>`;
            } else if (e.iShowed && e.iShowed.length > 0) {
                const card = e.iShowed[0].card;
                html += ` <span class="log-arrow">→</span> <span class="log-shower pc2">Me showed</span> <span class="log-ishowed">${card}</span>`;
            } else if (e.shownMe && e.shownMe.length > 0) {
                const s = e.shownMe[0];
                const showerCol = turnOrder.find(c => getColName(c) === s.player) ?? -1;
                const spc = showerCol >= 0 ? playerColorClass(showerCol) : pc;
                html += ` <span class="log-arrow">→</span> <span class="log-shower ${spc}">${s.player} showed Me</span> <span class="log-showed-card">${s.card}</span>`;
            } else if (e.live) {
                html += ` <span class="log-arrow">→</span> <span class="log-nobody">waiting...</span>`;
            } else {
                html += ` <span class="log-arrow">→</span> <span class="log-nobody">nobody</span>`;
            }
        }

        div.innerHTML = html;
        list.appendChild(div);
    });
}


// ═══════════════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════════════
function getHeaderNames() { const n=[]; for(let i=1;i<=6;i++){ const el=document.getElementById('p'+i+'h'); n.push(el?el.value:''); } return n; }
function applyHeaderNames(n) { n.forEach((v,i)=>{ const el=document.getElementById('p'+(i+1)+'h'); if(el) el.value=v; }); }

function getSnapshot() {
    return { cellState, gameLog, turnOrder, turnStep, turnCount, meCol, meOriginalName, gamePhase,
             headerNames: getHeaderNames(),  /* M11/06: notes field dropped */
             solutionCards: [...solutionCards],
             // M2 fixed 4×30 grid + active/muted state
             categories: CATEGORIES.map(c => ({ name:c.name, cards:[...c.cards] })),
             mutedCategoryIdxs: [...mutedCategoryIdxs],
             mutedCards: [...mutedCards],
             // F4: card counts (numbers; null = not entered) + summary marks.
             // M11/01: cellNotes removed (mini-notes feature retired).
             // M11/03: roomChecked — 2-player variant face-down-card tracker.
             playerCardCounts: [...playerCardCounts],
             summaryMarks: { ...summaryMarks },
             roomChecked: [...roomChecked],
             setupStep,
             schemaVersion: 7 };
}

function applySnapshot(d) {
    // Restore categories. We always end up with exactly 4 categories totaling 30 cards.
    if (Array.isArray(d.categories) && d.categories.length) {
        CATEGORIES = d.categories.map(c => ({ name:c.name || 'Category', cards:[...(c.cards || [])] }));
    } else if (d.suspects || d.weapons || d.rooms || d.motives) {
        // Legacy save: stitch the old fixed arrays into the new shape
        CATEGORIES = [];
        if (d.suspects && d.suspects.length) CATEGORIES.push({ name:'Suspects', cards:[...d.suspects] });
        if (d.weapons  && d.weapons.length)  CATEGORIES.push({ name:'Weapons',  cards:[...d.weapons]  });
        if (d.rooms    && d.rooms.length)    CATEGORIES.push({ name:'Rooms',    cards:[...d.rooms]    });
        if (d.motives  && d.motives.length)  CATEGORIES.push({ name:'Motives',  cards:[...d.motives]  });
        if (!CATEGORIES.length) CATEGORIES = defaultCategories();
    }
    normalizeCategoryShape();
    // This version has no muted cards and no unused categories.
    mutedCategoryIdxs = new Set();
    mutedCards        = new Set();
    // F4: card counts + summary marks
    // (M11/01: cell notes removed)
    if (Array.isArray(d.playerCardCounts) && d.playerCardCounts.length === MAX_PLAYERS) {
        playerCardCounts = d.playerCardCounts.map(v =>
            (typeof v === 'number' && Number.isInteger(v) && v >= 0 && v <= 99) ? v : null);
    } else {
        // Older saves carried text nicknames in this slot — discard them
        // (nicknames are retired; the count shows '?' until typed).
        playerCardCounts = Array(MAX_PLAYERS).fill(null);
    }
    // M11/01: cellNotes removed — older saves are silently ignored.
    summaryMarks = (d.summaryMarks && typeof d.summaryMarks === 'object') ? { ...d.summaryMarks } : {};
    // M11/03: restore room-checked set (older saves get an empty set).

// M10/Polish — Shared status renderer. Long messages scroll across their slot:
//   hold 1s at start, scroll, hold 2s at end, clear. Short messages just hold 5s.
//   Used by both showStatus (Phase Bar) and showDeckStatus (Deck Bar).
const _statusTokens = { status: 0, deckStatus: 0 };
function _renderScrollingStatus(el, msg, color, key, onCleared) {
    if (!el) return;
    el.style.color = color || '';
    el.innerHTML = '';
    if (!msg) { el.title = ''; if (onCleared) onCleared(); return; }
    const inner = document.createElement('span');
    inner.className = 'status-inner';
    inner.textContent = msg;
    el.title = msg; // hover always shows the full text too
    el.appendChild(inner);
    const myToken = ++_statusTokens[key];
    requestAnimationFrame(() => {
        if (myToken !== _statusTokens[key]) return;
        const overflow = inner.scrollWidth - el.clientWidth;
        let totalMs;
        if (overflow > 4) {
            const scrollSec = Math.max(3, Math.min(10, overflow / 35));
            const totalSec  = scrollSec + 1 + 2;
            inner.style.setProperty('--status-shift', `-${overflow}px`);
            inner.style.animationDuration = `${totalSec}s`;
            inner.classList.add('marquee');
            totalMs = totalSec * 1000 + 200;
        } else {
            totalMs = 5000;
        }
        setTimeout(() => {
            if (myToken !== _statusTokens[key]) return;
            el.innerHTML = '';
            el.title = '';
            if (onCleared) onCleared();
        }, totalMs);
    });
}
// True while a hint or warning owns the game row. The turn line
// waits. The page writes these words. They do not come from the engine.
let gameRowMessage = false;

function showStatus(msg, color) {
    // M11/13: Game status messages now overwrite the phaseDirective text in
    //   place. The directive comes back automatically via updatePhaseBarText()
    //   when the status timer clears (or immediately if msg is empty).
    const el = document.getElementById('phaseDirective');
    if (!el) return;
    gameRowMessage = !!msg;
    _renderScrollingStatus(el, msg, color, 'status', () => {
        gameRowMessage = false;
        el.style.color = '';
        updatePhaseBarText();
    });
}

// A tap at the wrong point. The words are the page's, in a game
// the engine is running and in one it is not. The engine still
// decides whether the tap counts.
function showPlayHint(where, col) {
    const s = Engine.inspect();
    if (!s.gameInProgress || s.accusationResult !== null) return;
    const asker = engineAskerCol();
    const nCats = s.categories.filter(c => c.cards.length > 0).length;
    const asked = s.pendingCards || [];
    const whose = (asker === s.meSlot) ? 'your own' : "the current player's";

    if (where === 'cell') {
        if (s.gamePhase === 'asking') {
            showStatus('Click a card in the current player\'s column to mark Asked.', 'var(--red-lt)');
            return;
        }
        if (s.gamePhase === 'showing') {
            showStatus("Click the name at the top of the column of the player who showed — the popup will ask which card.", 'var(--red-lt)');
            return;
        }
        showStatus('Tap Next to continue.', 'var(--red-lt)');
        return;
    }

    if (s.gamePhase === 'waiting') {
        showStatus('Tap Next to continue.', 'var(--red-lt)');
        return;
    }
    if (s.gamePhase === 'asking' || asked.length < nCats) {
        const word = nCats === 1 ? 'card' : 'cards';
        showStatus(`Click ${nCats} ${word} in ${whose} column first.`, 'var(--red-lt)');
        return;
    }
    if (col === asker) {
        showStatus(`${getColName(col)} is asking — cannot also show.`, 'var(--red-lt)');
        return;
    }
    if (asked.length && asked.every(card =>
        Engine.visibleMarks(card, col).some(m => m.type === 'cross'))) {
        showStatus(`${getColName(col)} has ❌ on all asked cards — cannot show.`, 'var(--red-lt)');
        return;
    }
    const ring = s.activePlayers;
    const ai = ring.indexOf(asker);
    const size = ring.length;
    if (ai >= 0 && size > 0) {
        const colPos = (ring.indexOf(col) - ai - 1 + size) % size;
        for (let i = 1; i < size; i++) {
            const c = ring[(ai + i) % size];
            if (c === asker) continue;
            const must = asked.some(card =>
                Engine.visibleMarks(card, c).some(m => m.type === 'check'));
            if (must) {
                const mustPos = (ring.indexOf(c) - ai - 1 + size) % size;
                if (colPos > mustPos) {
                    showStatus(`${getColName(c)} must show first — they have a card.`, 'var(--red-lt)');
                    return;
                }
                break;
            }
        }
    }
}
// M11/12: Deck status messages now overwrite the deck-hint text in-place.
//   When the message clears, the original hint ("← right-click Export/Delete")

// M5+: Dynamic Phase Bar text — separate prefix + directive
// Per-turn directive ("Eve is guessing" / "Eve is waiting" / "Bob showed") lives in the
// Directives Bar (#deckBarDirective — the Deck Bar repurposed during Play). Phase Bar
// carries turn info, wizard steps, "{name}'s turn", and status messages.
function updatePhaseBarText() {
    const pre   = document.getElementById('phasePrefix');
    const dir   = document.getElementById('phaseDirective');
    const hdr   = document.getElementById('headerDirective');
    const dkDir = document.getElementById('deckBarDirective');
    if (!pre || !dir) return;

    if (gamePhase === 'setup') {
        pre.textContent = '⚙️ Setup';
        if (hdr)   hdr.textContent   = '';
        if (dkDir) dkDir.textContent = '';
        dir.textContent = '— Change card names, enter players, choose Me, then start the game.';
    } else if (enginePlaying()) {
        showEngineNow();
    } else {
        // M12/03 — Option B split:
        //   Phase Bar     = identity context (turn number + whose turn it is).
        //   Directives Bar (Deck Bar in Play) = action context (state + instruction).
        //   showStatus() still writes to phaseDirective; a status message
        //   briefly covers the identity line — the user can still read the
        //   Directives Bar for action context.
        pre.textContent = `🎮 Game · Turn ${turnCount}`;
        if (hdr) hdr.textContent = '';
        const cur = getCurrentCol();
        const isMe = (cur === meCol);
        const name = isMe ? 'You' : getCurrentPlayerName();
        // Phase Bar directive: just whose turn it is.
        dir.textContent = isMe ? `— Your turn` : `— ${name}'s turn`;
        // Directives Bar: state + instruction.
        const hasShowed = pendingShowed.length > 0
                        || pendingShownMe.some(p => p.committed)
                        || pendingIShowed.some(p => p.committed);
        let stateText, instructionText;
        if (hasShowed) {
            const showerName = pendingShowed.length > 0 ? getColName(pendingShowed[0].col)
                             : (pendingIShowed.length > 0 ? 'You' : (pendingShownMe[0] && pendingShownMe[0].player) || name);
            stateText = `${showerName} showed`;
            instructionText = `Tap Next to continue.`;
        } else if (committedAsked.length > 0) {
            stateText = isMe ? `You are waiting` : `${name} is waiting`;
            instructionText = `Tap the column header of the player who showed, or Next if nobody.`;
        } else if (pendingAsked.length === 0) {
            // M12/03: no asks picked yet — Thinking stage.
            stateText = isMe ? `You are thinking` : `${name} is thinking`;
            instructionText = `Tap all cards guessed, or tap Next if the player does not reach a room.`;
        } else {
            // 1–2 asks picked — Guessing stage.
            stateText = isMe ? `You are guessing` : `${name} is guessing`;
            instructionText = `Tap all cards guessed.`;
        }
        if (dkDir) dkDir.textContent = `${stateText} — ${instructionText}`;
    }
}

// M5+ / M10: Set tabIndex on inputs based on the current setup step.
// Step 1 → right-click work only, no typed inputs.
// Step 2 → category names tabbable. Step 3 → card names tabbable.
// Step 4 → player + count inputs tabbable. Step 5 → right-click + click cells, no Tab. In play, everything default.
function updateTabIndexes() {
    const setAll = (sel, idx) => document.querySelectorAll(sel).forEach(el => el.tabIndex = idx);
    // All focusable element types — used to blanket-block during setup so Tab
    // can't wander into buttons (Guide, Rules, Dark, Next, deck slots, ...),
    // Notes/Rules textareas, or browser chrome.
    const focusable = 'button, input, textarea, select, a[href]';

    if (gamePhase === 'setup') {
        // Block everything first…
        setAll(focusable, -1);

        // Category names stay fixed. Card names, player names, and card
        // counts can all be edited until the game starts.
        document.querySelectorAll('input.cat-name-input').forEach(el => {
            el.disabled = true;
        });
        document.querySelectorAll('input.card-name-input').forEach(el => {
            el.disabled = false;
        });
        for (let i = 1; i <= MAX_PLAYERS; i++) {
            const ph = document.getElementById('p'+i+'h');
            const cc = document.getElementById('p'+i+'c');
            if (ph) ph.disabled = false;
            if (cc) cc.disabled = false;
        }

        setAll('input.card-name-input, input.ph, input.cc', 0);
    } else {
        // Play phase — restore browser-default Tab order.
        setAll(focusable, 0);
    }
}

// Enable / disable the always-visible action buttons based on state.
function updateButtonStates() {
    const btnUndo       = document.getElementById('btnUndo');
    const btnUndoTyping = document.getElementById('btnUndoTyping');
    const btnNext       = document.getElementById('btnNextPlayer');
    const btnStart      = document.getElementById('btnStartGame');
    const inPlay        = (gamePhase === 'play');
    if (btnUndo) {
        let playCan = false;
        if (inPlay && enginePlaying()) {
            const s = Engine.inspect();
            const atStart = s.turnCount <= 1 && s.gamePhase === 'asking' && s.pendingCards.length === 0;
            playCan = !atStart;
        }
        btnUndo.disabled = !playCan;
    }
    if (btnUndoTyping) {
        // Typing can be taken back while the edits are still open.
        const typingNow = (gamePhase === 'setup');
        btnUndoTyping.style.display = typingNow ? '' : 'none';
        btnUndoTyping.disabled = !typingNow || (typingUndoStack.length === 0);
    }
    if (btnNext) {
        // Next runs the game. Start Game is the way out of the open edits.
        btnNext.disabled = !inPlay;
    }
    updateTabIndexes();
    if (btnStart) {
        // Me is chosen, Me's cards are checked, at least two players are
        // named, and the players' counts plus the board account for 18.
        if (inPlay) {
            btnStart.disabled = true;
        } else {
            const me = findMeCol();
            const namedCount = getHeaderNames().filter(n => (n || '').trim().length > 0).length;
            btnStart.disabled = (me < 0) || !meCardClicksOk(me) || namedCount < 2 || !dealAccountsForEighteen();
        }
    }
}

// Me's setup ✓s on active rows.
function meSetupCheckCount(me) {
    let checks = 0;
    for (const card of ALL_CARDS) {
        if (!isRowActive(card)) continue;
        const s = cellState[card] && cellState[card][me];
        if (s && s.check) checks++;
    }
    return checks;
}

// Me's setup ✓s vs Me's card count: equal when a count is typed,
// at least 2 when it isn't.
function meCardClicksOk(me) {
    if (me < 0) return false;
    const checks = meSetupCheckCount(me);
    const n = playerCardCounts[me];
    return (typeof n === 'number') ? (checks === n) : (checks >= 2);
}

// The deck is 21 cards. Three are the envelope. The other 18 are the
// players' counts and whatever is left for the board. Counts that add
// up to 18 leave the board empty. An even split under 18 leaves the
// rest on the board. Anything else keeps the game closed.
function dealAccountsForEighteen() {
    const names = getHeaderNames();
    const counts = [];
    for (let i = 0; i < MAX_PLAYERS; i++) {
        if (!(names[i] || '').trim()) continue;
        const n = playerCardCounts[i];
        if (typeof n !== 'number') return false;
        counts.push(n);
    }
    if (counts.length < 2) return false;
    const sum = counts.reduce((s, n) => s + n, 0);
    if (sum === 18) return true;
    if (sum < 18 && counts.every(n => n === counts[0])) return true;
    return false;
}

// M6: User's Guide content — conversational, written for someone who hasn't

    if (!body) return;
    body.innerHTML = `
        <h3>What this app is for</h3>
